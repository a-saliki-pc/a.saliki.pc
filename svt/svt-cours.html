<!DOCTYPE html>
<html lang="fr" dir="ltr" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cours de SVT | DARRSSY SVT</title>
<link rel="icon" type="image/png" href="../assets/logo-darrssy.png">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- KaTeX pour les formules mathématiques -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

<style>
:root { 
  --primary: #16213e; --primary-light: #2a9d8f; --accent: #e8a33d; --accent-dark: #c17f1e;
  --ink: #16213e; --gray: #5b6b7a; --gray-light: #93a3b0; --border: #d9d2bb; --light: #faf6ec; --white: #fffdf7;
  --shadow: 6px 6px 0 rgba(22,33,62,0.08); --shadow-lg: 10px 10px 0 rgba(22,33,62,0.1);
  --radius: 6px; --radius-sm: 4px; --transition: all 0.25s ease;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', 'Tajawal', sans-serif; background: linear-gradient(rgba(22,33,62,0.1) 0.5px, transparent 0.5px), linear-gradient(90deg, rgba(22,33,62,0.1) 0.5px, transparent 0.5px), linear-gradient(rgba(22,33,62,0.028) 0.5px, transparent 0.5px), linear-gradient(90deg, rgba(22,33,62,0.028) 0.5px, transparent 0.5px), var(--light); background-size: 50px 50px, 50px 50px, 10px 10px, 10px 10px, auto; color: var(--ink); line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column; }
[dir="rtl"] body { font-family: 'Tajawal', 'Inter', sans-serif; }
a { text-decoration: none; color: inherit; }
h1, h2, h3 { font-family: 'Fraunces', 'Tajawal', serif; }

nav { background: var(--white); border-bottom: 2px solid var(--ink); padding: 10px 5%; display: flex; justify-content: space-between; align-items: center; }
.logo { display: flex; align-items: center; gap: 12px; }
.logo-img-wrap { width: 40px; height: 40px; border-radius: 50%; background: var(--white); padding: 2px; border: 2px solid var(--ink); }
.logo-img-wrap img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
.logo-texte .titre { font-family: 'Fraunces', serif; font-size: 1.2rem; font-weight: 700; }
.nav-right { display: flex; align-items: center; gap: 10px; }
.lang-switcher { display: flex; background: var(--white); border: 2px solid var(--ink); border-radius: var(--radius-sm); overflow: hidden; }
.lang-btn { background: transparent; border: none; color: var(--ink); font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; font-weight: 700; padding: 6px 12px; cursor: pointer; transition: var(--transition); }
.lang-btn.actif { background: var(--ink); color: var(--white); }
.btn-back { background: var(--ink); color: var(--white); padding: 8px 18px; border-radius: var(--radius-sm); font-weight: 600; font-size: 0.9rem; transition: var(--transition); display: flex; align-items: center; gap: 6px; border: 2px solid var(--ink); }
.btn-back:hover { background: var(--white); color: var(--ink); }
.btn-back.secondary { background: transparent; color: var(--ink); border-color: var(--ink); }
.btn-back.secondary:hover { background: var(--ink); color: var(--white); }

.main-content { flex: 1; padding: 40px 5%; max-width: 1000px; margin: 0 auto; width: 100%; }
.page-title { text-align: center; margin-bottom: 30px; }
.page-title h1 { font-size: 2.2rem; margin-bottom: 10px; }
.page-title p { color: var(--gray); }

.level-filters { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 40px; }
.level-btn { background: var(--white); border: 2px solid var(--ink); color: var(--ink); padding: 10px 20px; border-radius: 50px; font-family: inherit; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: var(--transition); }
.level-btn:hover { background: var(--light); }
.level-btn.actif { background: var(--ink); color: var(--white); }

.level-section { display: none; animation: fadeIn 0.4s ease; }
.level-section.actif { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.cours-accordion { background: var(--white); border: 2px solid var(--ink); border-radius: var(--radius); margin-bottom: 15px; box-shadow: var(--shadow); overflow: hidden; transition: var(--transition); }
.cours-accordion:hover { border-color: var(--primary-light); box-shadow: var(--shadow-lg); }
.cours-header { padding: 20px 25px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; background: var(--white); transition: var(--transition); }
.cours-header:hover { background: var(--light); }
.cours-header-left { display: flex; align-items: center; gap: 15px; }
.cours-icon { width: 45px; height: 45px; border-radius: 50%; background: var(--light); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; color: var(--accent-dark); flex-shrink: 0; }
.cours-title { font-size: 1.15rem; font-weight: 600; color: var(--ink); margin-bottom: 4px; }
.cours-subtitle { font-size: 0.85rem; color: var(--gray); font-family: 'JetBrains Mono', monospace; }
.cours-toggle-icon { font-size: 1.2rem; color: var(--primary-light); transition: transform 0.3s ease; }
.cours-content { max-height: 0; overflow: hidden; transition: max-height 0.4s ease-out; background: #fafbfc; border-top: 0 solid var(--border); }
.cours-content.open { max-height: 2500px; border-top: 2px dashed var(--border); }
.cours-inner { padding: 25px; font-size: 0.95rem; color: var(--ink); }

.resume-block { margin-bottom: 20px; }
.resume-block h4 { font-size: 1rem; color: var(--primary-light); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
.resume-block p { line-height: 1.7; color: var(--ink); }
.formule-box { background: var(--white); border: 1.5px solid var(--ink); border-radius: var(--radius-sm); padding: 15px; text-align: center; font-size: 1.05rem; color: var(--accent-dark); margin: 15px 0; font-weight: 600; box-shadow: var(--shadow-sm); overflow-x: auto; }

.loading-zone { text-align: center; padding: 60px 20px; color: var(--gray); }
.loading-zone i { font-size: 2.1rem; color: var(--primary-light); animation: spin 1s linear infinite; display: block; margin-bottom: 15px; }
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

@media (max-width: 768px) {
  nav { padding: 10px 3%; }
  .logo-img-wrap { width: 35px; height: 35px; }
  .logo-texte .titre { font-size: 1rem; }
  .btn-back span { display: none; }
  .btn-back { padding: 8px 12px; font-size: 0.8rem; }
  .lang-btn { padding: 6px 8px; font-size: 0.7rem; }
  .main-content { padding: 20px 4%; }
  .page-title h1 { font-size: 1.6rem; }
  .level-filters { gap: 5px; }
  .level-btn { padding: 8px 12px; font-size: 0.8rem; }
  .cours-header { padding: 15px; }
  .cours-title { font-size: 0.95rem; }
  .cours-subtitle { font-size: 0.75rem; }
  .cours-icon { width: 35px; height: 35px; font-size: 1rem; }
  .cours-inner { padding: 15px; }
  .formule-box { font-size: 0.9rem; padding: 10px; }
}
</style>
</head>
<body>

<nav>
  <a href="../index.html" class="logo">
    <div class="logo-img-wrap"><img src="../assets/logo-darrssy.png" alt="DARRSSY"></div>
    <div class="logo-texte"><span class="titre">DARRSSY SVT</span></div>
  </a>
  <div class="nav-right">
    <div class="lang-switcher">
      <button class="lang-btn actif" data-lang="fr">FR</button>
      <button class="lang-btn" data-lang="ar">AR</button>
    </div>
    <a href="index.html" class="btn-back secondary"><i class="fas fa-th-large"></i> <span data-i18n="nav.menu">Menu</span></a>
    <a href="../index.html" class="btn-back"><i class="fas fa-home"></i> <span data-i18n="nav.home">Site</span></a>
  </div>
</nav>

<div class="main-content">
  <div class="page-title">
    <h1 data-i18n="title">Cours de SVT</h1>
    <p data-i18n="desc">Cliquez sur un cours pour voir le résumé complet.</p>
  </div>

  <div class="level-filters">
    <button class="level-btn actif" data-level="tronc" data-i18n="lvl.tronc">Tronc Commun</button>
    <button class="level-btn" data-level="1bac" data-i18n="lvl.1bac">1ère Année Bac</button>
    <button class="level-btn" data-level="2bac" data-i18n="lvl.2bac">2ème Année Bac</button>
  </div>

  <!-- ZONES DE CONTENU DYNAMIQUE -->
  <div class="level-section actif" id="level-tronc">
    <div id="cours-tronc" class="loading-zone"><i class="fas fa-spinner"></i><p data-i18n="loading">Chargement...</p></div>
  </div>
  <div class="level-section" id="level-1bac">
    <div id="cours-1bac" class="loading-zone"><i class="fas fa-spinner"></i><p data-i18n="loading">Chargement...</p></div>
  </div>
  <div class="level-section" id="level-2bac">
    <div id="cours-2bac" class="loading-zone"><i class="fas fa-spinner"></i><p data-i18n="loading">Chargement...</p></div>
  </div>
</div>

<!-- IMPORTANT : Charger darrssy-config.js pour Supabase -->
<script src="../admin/darrssy-config.js"></script>
<script>
let currentLang = localStorage.getItem('darrssy-lang') || 'fr';
let tousLesCours = [];

const trad = {
  fr: {
    'nav.menu': 'Menu', 'nav.home': 'Site', 'title': 'Cours de SVT', 'desc': 'Cliquez sur un cours pour voir le résumé complet.',
    'lvl.tronc': 'Tronc Commun', 'lvl.1bac': '1ère Année Bac', 'lvl.2bac': '2ème Année Bac',
    'loading': 'Chargement...', 'resume': 'Résumé du cours', 'noCours': 'Aucun cours disponible pour ce niveau pour le moment.'
  },
  ar: {
    'nav.menu': 'القائمة', 'nav.home': 'الموقع', 'title': 'دروس علوم الحياة والأرض', 'desc': 'انقر على درس لرؤية الملخص الكامل.',
    'lvl.tronc': 'الجذع المشترك', 'lvl.1bac': 'الأولى باكالوريا', 'lvl.2bac': 'الثانية باكالوريا',
    'loading': 'جارٍ التحميل...', 'resume': 'ملخص الدرس', 'noCours': 'لا يوجد أي درس متاح لهذا المستوى حالياً.'
  }
};

document.addEventListener('DOMContentLoaded', async () => {
  appliquerLangue(currentLang);
  bindEvents();
  await chargerCours();
  setTimeout(renderMath, 500);
});

function appliquerLangue(lang) {
  currentLang = lang;
  document.getElementById('htmlRoot').setAttribute('lang', lang);
  document.getElementById('htmlRoot').setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (trad[lang] && trad[lang][key]) el.innerHTML = trad[lang][key];
  });
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('actif', btn.getAttribute('data-lang') === lang);
  });
  localStorage.setItem('darrssy-lang', lang);
  if (tousLesCours.length > 0) afficherCours();
  setTimeout(renderMath, 200);
}

function bindEvents() {
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', () => appliquerLangue(btn.getAttribute('data-lang')));
  });
  document.querySelectorAll('.level-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.level-btn').forEach(b => b.classList.remove('actif'));
      btn.classList.add('actif');
      document.querySelectorAll('.level-section').forEach(s => s.classList.remove('actif'));
      document.getElementById('level-' + btn.getAttribute('data-level')).classList.add('actif');
    });
  });
}

// ==========================================
// CHARGEMENT DES COURS DEPUIS SUPABASE
// ==========================================
async function chargerCours() {
  try {
    if (typeof lireTable !== 'function') throw new Error("lireTable non chargé");
    
    // On récupère uniquement les cours de la matière "svt"
    tousLesCours = await lireTable('cours', { 
      filtres: { publie: true, matiere: 'svt' }, 
      ordre: { col: 'created_at', asc: false } 
    });
    
    afficherCours();
  } catch (err) {
    console.error(err);
    document.getElementById('cours-tronc').innerHTML = `<p style="color:red;">Erreur de chargement: ${err.message}</p>`;
  }
}

function afficherCours() {
  // Vider les conteneurs
  const containers = {
    tronc: document.getElementById('cours-tronc'),
    '1bac': document.getElementById('cours-1bac'),
    '2bac': document.getElementById('cours-2bac')
  };
  
  Object.values(containers).forEach(c => c.innerHTML = '');

  if (tousLesCours.length === 0) {
    containers['tronc'].innerHTML = `<p>${trad[currentLang]['noCours']}</p>`;
    return;
  }

  tousLesCours.forEach(c => {
    let niveau = c.niveau;
    let container = containers[niveau];
    
    // Si le niveau est 2bacpc ou 2bacsvt, on le met dans l'onglet 2bac
    if (niveau === '2bacpc' || niveau === '2bacsvt') {
      container = containers['2bac'];
    }
    
    if (!container) return; // Sécurité

    const titre = currentLang === 'fr' ? c.titre_fr : (c.titre_ar || c.titre_fr);
    const desc = currentLang === 'fr' ? (c.description_fr || '') : (c.description_ar || c.description_fr || '');
    
    // On crée l'accordéon
    const accordion = document.createElement('div');
    accordion.className = 'cours-accordion';
    accordion.innerHTML = `
      <div class="cours-header" onclick="toggleAccordion(this)">
        <div class="cours-header-left">
          <div class="cours-icon"><i class="fas ${c.icone || 'fa-dna'}"></i></div>
          <div>
            <div class="cours-title">${titre}</div>
            <div class="cours-subtitle">${c.chapitre_fr || 'Général'}</div>
          </div>
        </div>
        <i class="fas fa-chevron-down cours-toggle-icon"></i>
      </div>
      <div class="cours-content">
        <div class="cours-inner">
          <div class="resume-block">
            <h4><i class="fas fa-bookmark"></i> ${trad[currentLang]['resume']}</h4>
            <p>${desc}</p>
          </div>
        </div>
      </div>
    `;
    
    container.appendChild(accordion);
  });
  
  // Si un conteneur est resté vide (aucun cours pour ce niveau)
  Object.keys(containers).forEach(k => {
    if (containers[k].innerHTML === '') {
      containers[k].innerHTML = `<p style="color:var(--gray);">${trad[currentLang]['noCours']}</p>`;
    }
  });
  
  setTimeout(renderMath, 100);
}

function toggleAccordion(header) {
  const content = header.nextElementSibling;
  const icon = header.querySelector('.cours-toggle-icon');
  content.classList.toggle('open');
  if (content.classList.contains('open')) icon.style.transform = 'rotate(180deg)';
  else icon.style.transform = 'rotate(0deg)';
  setTimeout(renderMath, 100);
}

function renderMath() {
  if (window.renderMathInElement) {
    renderMathInElement(document.body, {
      delimiters: [
        { left: '$$', right: '$$', display: false },
        { left: '$', right: '$', display: false }
      ],
      throwOnError: false
    });
  }
}
</script>
<script data-goatcounter="https://darrssy.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
