<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Mouvement - Simulation Pédagogique</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #f8fafc; /* Fond très clair, idéal projection */
            color: #0f172a;
            font-family: 'Inter', system-ui, sans-serif;
        }

        .control-panel {
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border-radius: 12px;
        }

        #canvas-wrapper {
            position: relative;
            background-color: #ffffff;
            background-image: 
                linear-gradient(#f1f5f9 2px, transparent 2px),
                linear-gradient(90deg, #f1f5f9 2px, transparent 2px);
            background-size: 50px 50px; /* Quadrillage représentant 1 mètre */
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.02);
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Personnalisation propre des sliders */
        input[type=range] {
            -webkit-appearance: none; width: 100%; background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 16px; width: 16px;
            border-radius: 50%; background: #3b82f6; cursor: pointer;
            margin-top: -6px;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px; cursor: pointer;
            background: #cbd5e1; border-radius: 2px;
        }
        
        .data-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 0.5rem 1rem;
        }
    </style>
</head>
<body class="flex flex-col h-screen p-4 md:p-6 gap-4">

    <!-- En-tête -->
    <header class="flex justify-between items-end pb-3 border-b-2 border-slate-200 shrink-0">
        <div>
            <h1 class="text-3xl font-extrabold text-slate-800 tracking-tight">Le Mouvement</h1>
            <p class="text-sm text-slate-500 font-semibold uppercase tracking-wider mt-1">Physique • Tronc Commun • Simulation Interactive</p>
        </div>
    </header>

    <!-- Zone principale -->
    <main class="flex flex-col lg:flex-row flex-1 gap-4 min-h-0">
        
        <!-- Panneau Gauche : Contrôles -->
        <div class="control-panel p-5 w-full lg:w-[340px] flex flex-col shrink-0 overflow-y-auto">
            <h2 class="text-base font-bold mb-4 text-slate-800 border-b-2 border-slate-100 pb-2">Configuration du système</h2>
            
            <!-- Type de mouvement -->
            <div class="mb-5">
                <label class="block text-sm font-semibold text-slate-700 mb-2">Type de trajectoire et vitesse</label>
                <select id="mvtType" class="w-full bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 font-medium cursor-pointer">
                    <option value="ru">Rectiligne Uniforme</option>
                    <option value="ra">Rectiligne Accéléré</option>
                    <option value="rr">Rectiligne Ralenti</option>
                    <option value="cu">Circulaire Uniforme</option>
                </select>
            </div>

            <h2 class="text-base font-bold mt-2 mb-3 text-slate-800 border-b-2 border-slate-100 pb-2">Options d'affichage</h2>
            
            <!-- Checkboxes -->
            <div class="space-y-3 mb-6">
                <label class="flex items-center gap-3 cursor-pointer hover:bg-slate-50 p-2 rounded-lg border border-transparent hover:border-slate-200 transition-colors">
                    <input type="checkbox" id="showV" checked class="w-5 h-5 text-red-600 bg-gray-100 border-gray-300 rounded focus:ring-red-500 focus:ring-2">
                    <div class="flex flex-col">
                        <span class="text-slate-800 font-semibold text-sm">Vecteur Vitesse (<span class="italic text-red-600 font-bold">V</span>)</span>
                    </div>
                </label>
                
                <label class="flex items-center gap-3 cursor-pointer hover:bg-slate-50 p-2 rounded-lg border border-transparent hover:border-slate-200 transition-colors">
                    <input type="checkbox" id="showChrono" checked class="w-5 h-5 text-blue-600 bg-gray-100 border-gray-300 rounded focus:ring-blue-500 focus:ring-2">
                    <div class="flex flex-col">
                        <span class="text-slate-800 font-semibold text-sm">Chronophotographie</span>
                        <span class="text-slate-500 text-xs">Intervalle régulier Δt = 0.5s</span>
                    </div>
                </label>
            </div>

            <h2 class="text-base font-bold mt-auto mb-3 text-slate-800 border-b-2 border-slate-100 pb-2">Contrôle de l'expérience</h2>
            
            <div class="mb-5">
                <label class="flex justify-between items-end mb-2 text-sm font-semibold text-slate-700">
                    <span>Vitesse de la simulation</span>
                    <span id="simSpeedDisplay" class="font-mono bg-slate-100 px-2 rounded border border-slate-200">1.0x</span>
                </label>
                <input type="range" id="simSpeed" min="0.1" max="2" step="0.1" value="1">
            </div>

            <div class="flex gap-2">
                <button id="playBtn" class="flex-1 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-bold transition-colors flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M5 3l14 9-14 9V3z"/></svg>
                    Play
                </button>
                <button id="resetBtn" class="py-3 px-4 bg-slate-200 hover:bg-slate-300 text-slate-800 rounded-lg font-semibold transition-colors border border-slate-300">
                    Reset
                </button>
            </div>
        </div>

        <!-- Espace Simulation & Télémétrie -->
        <div class="flex-1 flex flex-col gap-4 min-w-0">
            <!-- Canvas -->
            <div id="canvas-wrapper" class="flex-1 w-full relative">
                <canvas id="simCanvas"></canvas>
                <!-- Indication d'échelle -->
                <div class="absolute bottom-3 right-3 bg-white/90 border border-slate-300 p-1.5 rounded text-xs font-semibold text-slate-600 shadow-sm flex items-center gap-2">
                    <span>Échelle : 1 carreau = 1m</span>
                    <div class="w-[50px] h-1 bg-slate-800"></div>
                </div>
            </div>

            <!-- Télémétrie (Données en temps réel) -->
            <div class="control-panel p-4 flex flex-wrap md:flex-nowrap justify-between gap-4 shrink-0">
                <div class="data-box flex-1 flex flex-col items-center justify-center">
                    <span class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-1">Temps (t)</span>
                    <span id="timeData" class="font-mono text-2xl font-bold text-slate-800">0.00 <span class="text-sm font-semibold text-slate-500">s</span></span>
                </div>
                <div class="data-box flex-1 flex flex-col items-center justify-center border-l-4 border-l-red-500">
                    <span class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-1">Vitesse (v)</span>
                    <span id="velData" class="font-mono text-2xl font-bold text-red-600">0.00 <span class="text-sm font-semibold text-red-400">m/s</span></span>
                </div>
                <div class="data-box flex-1 flex flex-col items-center justify-center border-l-4 border-l-emerald-500">
                    <span class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-1">Position (x, y)</span>
                    <span id="posData" class="font-mono text-2xl font-bold text-emerald-600">0.00 <span class="text-sm font-semibold text-emerald-400">m</span></span>
                </div>
            </div>
        </div>
    </main>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const wrapper = document.getElementById('canvas-wrapper');

        // UI Elements
        const selectMvt = document.getElementById('mvtType');
        const showVCheck = document.getElementById('showV');
        const showChronoCheck = document.getElementById('showChrono');
        const simSpeedSlider = document.getElementById('simSpeed');
        const playBtn = document.getElementById('playBtn');
        const resetBtn = document.getElementById('resetBtn');

        const outTime = document.getElementById('timeData');
        const outVel = document.getElementById('velData');
        const outPos = document.getElementById('posData');

        // Constantes visuelles
        const pxPerMeter = 50; // 50 pixels = 1 mètre (taille du quadrillage)
        const dtChrono = 0.5; // Intervalle de temps pour la chronophotographie (secondes)

        // État de la simulation
        let state = {
            t: 0,
            x: 0, y: 0,
            vx: 0, vy: 0,
            ax: 0, ay: 0,
            isPlaying: false,
            speedScale: 1,
            mvt: 'ru', // ru, ra, rr, cu
            
            // Pour la chronophotographie
            chronoMarks: [],
            lastMarkTime: -dtChrono, // Pour placer une marque à t=0 immédiatement

            // Centre de la trajectoire circulaire
            cx: 0, cy: 0, radius: 3, omega: Math.PI / 2
        };

        // Redimensionnement du canvas
        function resizeCanvas() {
            canvas.width = wrapper.clientWidth;
            canvas.height = wrapper.clientHeight;
            resetSim(); // Réinitialise pour bien se centrer si redimensionnement
        }
        window.addEventListener('resize', resizeCanvas);

        // Initialisation de l'état selon le type de mouvement
        function resetSim() {
            state.t = 0;
            state.chronoMarks = [];
            state.lastMarkTime = -dtChrono;
            state.mvt = selectMvt.value;
            
            // Calcul du centre vertical du canvas (en mètres)
            const midY = (canvas.height / 2) / pxPerMeter;
            const startX = 1; // Commence à 1 mètre du bord gauche

            switch(state.mvt) {
                case 'ru': // Rectiligne Uniforme : Vitesse constante, a = 0
                    state.x = startX; state.y = midY;
                    state.vx = 4; state.vy = 0; // 4 m/s
                    state.ax = 0; state.ay = 0;
                    break;
                case 'ra': // Rectiligne Accéléré : V_initiale = 0, a > 0
                    state.x = startX; state.y = midY;
                    state.vx = 0; state.vy = 0;
                    state.ax = 2; state.ay = 0; // 2 m/s²
                    break;
                case 'rr': // Rectiligne Ralenti : V_initiale forte, a < 0
                    state.x = startX; state.y = midY;
                    state.vx = 10; state.vy = 0; // 10 m/s au départ
                    state.ax = -2; state.ay = 0; // Freine de 2 m/s²
                    break;
                case 'cu': // Circulaire Uniforme
                    state.radius = Math.min((canvas.height/2)/pxPerMeter - 1, 3); // Adapte le rayon
                    state.cx = (canvas.width / 2) / pxPerMeter;
                    state.cy = midY;
                    state.omega = Math.PI / 2; // 90 degrés par seconde
                    // Position initiale (angle 0)
                    state.x = state.cx + state.radius;
                    state.y = state.cy;
                    // Vitesse tangentielle
                    state.vx = 0; 
                    state.vy = state.radius * state.omega;
                    break;
            }

            // Pause si on réinitialise manuellement
            if(state.isPlaying && this === resetBtn) {
                togglePlay();
            }

            updateUI();
            drawScene();
        }

        // Boucle Physique Mathématique
        function updatePhysics(dtReal) {
            if(!state.isPlaying) return;

            let dt = dtReal * state.speedScale;
            state.t += dt;

            // Mise à jour cinématique
            if (state.mvt === 'cu') {
                // Mouvement circulaire
                let theta = state.omega * state.t;
                state.x = state.cx + state.radius * Math.cos(theta);
                state.y = state.cy + state.radius * Math.sin(theta);
                
                // Dérivée pour la vitesse : V = R*omega (tangente)
                state.vx = -state.radius * state.omega * Math.sin(theta);
                state.vy = state.radius * state.omega * Math.cos(theta);
            } 
            else {
                // Mouvements rectilignes
                state.vx += state.ax * dt;
                state.vy += state.ay * dt;

                // Stop pour le rectiligne ralenti quand la vitesse s'annule
                if (state.mvt === 'rr' && state.vx <= 0) {
                    state.vx = 0;
                    state.ax = 0;
                    togglePlay(); // Arrêt automatique
                }

                state.x += state.vx * dt;
                state.y += state.vy * dt;

                // Wrap around screen pour RU et RA (recommence au début)
                if (state.x * pxPerMeter > canvas.width + 100 && (state.mvt === 'ru' || state.mvt === 'ra')) {
                    state.x = -1; // Réapparaît à gauche
                    // On efface la chrono pour faire propre
                    state.chronoMarks = [];
                }
            }

            // Enregistrement Chronophotographie
            if (state.t - state.lastMarkTime >= dtChrono) {
                state.chronoMarks.push({x: state.x, y: state.y});
                state.lastMarkTime += dtChrono;
            }

            updateUI();
        }

        // Boucle de rendu
        let lastTime = performance.now();
        function animate(time) {
            const dtReal = (time - lastTime) / 1000;
            lastTime = time;

            // Protection contre les lags si l'onglet était inactif
            if (dtReal < 0.2) { 
                updatePhysics(dtReal);
            }

            drawScene();
            requestAnimationFrame(animate);
        }

        function drawScene() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Dessin de la trajectoire (Guide visuel léger)
            ctx.beginPath();
            if (state.mvt === 'cu') {
                ctx.arc(state.cx * pxPerMeter, state.cy * pxPerMeter, state.radius * pxPerMeter, 0, Math.PI * 2);
            } else {
                ctx.moveTo(0, state.y * pxPerMeter);
                ctx.lineTo(canvas.width, state.y * pxPerMeter);
            }
            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 2;
            ctx.setLineDash([8, 8]);
            ctx.stroke();
            ctx.setLineDash([]);

            // Dessin de la Chronophotographie
            if (showChronoCheck.checked) {
                ctx.fillStyle = '#94a3b8'; // Gris pour les traces fantômes
                for (let mark of state.chronoMarks) {
                    ctx.beginPath();
                    ctx.arc(mark.x * pxPerMeter, mark.y * pxPerMeter, 12, 0, Math.PI*2);
                    ctx.fill();
                    // Centre
                    ctx.fillStyle = '#f8fafc';
                    ctx.beginPath(); ctx.arc(mark.x * pxPerMeter, mark.y * pxPerMeter, 3, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#94a3b8'; // Reset
                }
            }

            const px = state.x * pxPerMeter;
            const py = state.y * pxPerMeter;

            // Dessin du Mobile (Voiture/Bille)
            ctx.fillStyle = '#1e293b';
            ctx.shadowBlur = 10;
            ctx.shadowColor = 'rgba(0,0,0,0.2)';
            ctx.beginPath();
            ctx.arc(px, py, 16, 0, Math.PI*2);
            ctx.fill();
            
            // Point central G (Centre de gravité)
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'white';
            ctx.beginPath(); ctx.arc(px, py, 4, 0, Math.PI*2); ctx.fill();

            // Dessin du vecteur vitesse V
            if (showVCheck.checked) {
                const vNorm = Math.sqrt(state.vx*state.vx + state.vy*state.vy);
                if (vNorm > 0.1) {
                    // Échelle du vecteur : 1 m/s = 20 pixels
                    const vScale = 15; 
                    const angle = Math.atan2(state.vy, state.vx);
                    const length = vNorm * vScale;
                    
                    drawArrow(px, py, length, angle, '#dc2626', 'V');
                }
            }
        }

        function drawArrow(x, y, length, angle, color, label) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);

            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(length, 0);
            ctx.strokeStyle = color;
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.stroke();

            // Tête de flèche
            let headSize = 12;
            ctx.beginPath();
            ctx.moveTo(length + 2, 0);
            ctx.lineTo(length - headSize, -headSize*0.6);
            ctx.lineTo(length - headSize, headSize*0.6);
            ctx.fillStyle = color;
            ctx.fill();

            // Texte (Label)
            ctx.rotate(-angle); // Redresser le texte pour qu'il soit toujours lisible
            ctx.fillStyle = color;
            ctx.font = 'italic bold 20px "Times New Roman", serif';
            
            // Position dynamique du label (décalé)
            let lx = Math.cos(angle) * (length/2) - 10;
            let ly = Math.sin(angle) * (length/2) - 15;
            
            ctx.fillText(label, lx, ly);
            
            // Flèche du vecteur au dessus de la lettre
            ctx.beginPath();
            ctx.moveTo(lx, ly - 20);
            ctx.lineTo(lx + 12, ly - 20);
            ctx.lineTo(lx + 8, ly - 23);
            ctx.moveTo(lx + 12, ly - 20);
            ctx.lineTo(lx + 8, ly - 17);
            ctx.lineWidth = 1.5;
            ctx.stroke();

            ctx.restore();
        }

        // UI Updates
        function updateUI() {
            outTime.innerHTML = state.t.toFixed(2) + ' <span class="text-sm font-semibold text-slate-500">s</span>';
            
            const vNorm = Math.sqrt(state.vx*state.vx + state.vy*state.vy);
            outVel.innerHTML = vNorm.toFixed(1) + ' <span class="text-sm font-semibold text-red-400">m/s</span>';

            if(state.mvt === 'cu') {
                // Pour le mouvement circulaire on affiche les coordonées (x, y) relatives au centre
                const relX = (state.x - state.cx);
                const relY = -(state.y - state.cy); // Y inversé car l'axe du canvas descend
                outPos.innerHTML = `(${relX.toFixed(1)}, ${relY.toFixed(1)})`;
            } else {
                // Pour le mouvement rectiligne on affiche X
                outPos.innerHTML = state.x.toFixed(2) + ' <span class="text-sm font-semibold text-emerald-400">m</span>';
            }
        }

        // Actions
        function togglePlay() {
            state.isPlaying = !state.isPlaying;
            if(state.isPlaying) {
                playBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg> Pause`;
                playBtn.classList.replace('bg-blue-600', 'bg-amber-500');
                playBtn.classList.replace('hover:bg-blue-700', 'hover:bg-amber-600');
            } else {
                playBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M5 3l14 9-14 9V3z"/></svg> Play`;
                playBtn.classList.replace('bg-amber-500', 'bg-blue-600');
                playBtn.classList.replace('hover:bg-amber-600', 'hover:bg-blue-700');
            }
        }

        // Événements
        playBtn.addEventListener('click', togglePlay);
        resetBtn.addEventListener('click', resetSim);
        selectMvt.addEventListener('change', resetSim);
        
        simSpeedSlider.addEventListener('input', (e) => {
            state.speedScale = parseFloat(e.target.value);
            document.getElementById('simSpeedDisplay').innerText = state.speedScale.toFixed(1) + 'x';
        });

        // Les checkboxes redessinent directement
        showVCheck.addEventListener('change', drawScene);
        showChronoCheck.addEventListener('change', drawScene);

        // Initialisation
        setTimeout(() => {
            resizeCanvas();
            requestAnimationFrame(animate);
        }, 100);

    </script>
</body>
</html>
