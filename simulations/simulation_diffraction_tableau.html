<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulation Diffraction - Tronc Commun / Bac</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0; padding: 0; background-color: #0b1120; color: #f8fafc;
            font-family: 'Inter', system-ui, sans-serif; overflow: hidden;
        }
        input[type=range] {
            -webkit-appearance: none; width: 100%; background: transparent;
        }
        input[type=range]:focus { outline: none; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 18px; width: 18px;
            border-radius: 50%; cursor: pointer; background: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.8); margin-top: -7px;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px; cursor: pointer; background: #334155; border-radius: 2px;
        }
        .math-font { font-family: 'Cambria Math', 'Times New Roman', serif; font-style: italic; }
    </style>
</head>
<body class="flex flex-col h-screen w-full">

    <!-- HEADER -->
    <header class="flex-none h-14 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-6 z-10 shadow-md">
        <div class="flex items-center gap-3">
            <div class="w-3 h-3 rounded-full bg-red-500 shadow-[0_0_8px_#ef4444] animate-pulse"></div>
            <h1 class="text-lg font-extrabold tracking-wider uppercase text-slate-100">Phénomène de Diffraction <span class="text-slate-500 font-light">| Laboratoire Virtuel</span></h1>
        </div>
        <div class="text-slate-400 font-mono text-xs font-semibold bg-slate-800 px-3 py-1 rounded border border-slate-700">
            Inspiré du schéma de cours
        </div>
    </header>

    <!-- CANVAS AREA -->
    <main class="flex-1 relative w-full bg-slate-950 overflow-hidden">
        <canvas id="simCanvas" class="absolute inset-0 w-full h-full block"></canvas>
    </main>

    <!-- FOOTER CONTROLS & MATH -->
    <footer class="flex-none h-72 bg-slate-900 border-t border-slate-800 flex shadow-2xl z-10">
        
        <!-- CONTROLS -->
        <div class="w-1/2 p-6 border-r border-slate-800 flex flex-col justify-center space-y-5">
            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest">Paramètres de l'expérience</h3>
            
            <!-- Lambda -->
            <div>
                <div class="flex justify-between text-xs font-bold mb-1.5">
                    <span class="text-slate-300">Longueur d'onde (<span class="math-font text-cyan-400 text-sm">λ</span>)</span>
                    <span id="val-lambda" class="font-mono text-cyan-400 bg-slate-950 px-2 py-0.5 rounded border border-slate-800">632 nm</span>
                </div>
                <input type="range" id="slider-lambda" min="400" max="750" value="632" data-key="lambda">
            </div>

            <!-- Fente a -->
            <div>
                <div class="flex justify-between text-xs font-bold mb-1.5">
                    <span class="text-slate-300">Largeur de la fente (<span class="math-font text-fuchsia-400 text-sm">a</span>)</span>
                    <span id="val-a" class="font-mono text-fuchsia-400 bg-slate-950 px-2 py-0.5 rounded border border-slate-800">0.10 mm</span>
                </div>
                <input type="range" id="slider-a" min="0.02" max="0.30" step="0.01" value="0.10" data-key="a">
            </div>

            <!-- Distance D -->
            <div>
                <div class="flex justify-between text-xs font-bold mb-1.5">
                    <span class="text-slate-300">Distance fente-écran (<span class="math-font text-emerald-400 text-sm">D</span>)</span>
                    <span id="val-d" class="font-mono text-emerald-400 bg-slate-950 px-2 py-0.5 rounded border border-slate-800">2.0 m</span>
                </div>
                <input type="range" id="slider-d" min="0.5" max="4.0" step="0.1" value="2.0" data-key="d">
            </div>
        </div>

        <!-- FORMULAS & RESULTS -->
        <div class="w-1/2 p-6 flex flex-col justify-center bg-slate-900/50">
            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4">Relations Mathématiques</h3>
            
            <div class="grid grid-cols-2 gap-4">
                <!-- Theta -->
                <div class="bg-slate-950 p-4 rounded-lg border border-slate-800">
                    <span class="text-[10px] font-bold text-slate-500 uppercase">1. Écart angulaire</span>
                    <div class="font-mono text-center text-xs text-slate-300 my-1 bg-slate-900 py-1.5 rounded">
                        <span class="math-font text-cyan-400 text-sm">θ</span> = <span class="math-font text-cyan-400 text-sm">λ</span> / <span class="math-font text-fuchsia-400 text-sm">a</span>
                    </div>
                    <div class="text-right">
                        <span id="calc-theta" class="font-mono text-lg font-bold text-cyan-400">0.00</span> <span class="text-xs text-slate-500 font-bold">rad</span>
                    </div>
                </div>

                <!-- L -->
                <div class="bg-slate-950 p-4 rounded-lg border border-slate-800">
                    <span class="text-[10px] font-bold text-slate-500 uppercase">2. Tache Centrale (L)</span>
                    <div class="font-mono text-center text-xs text-slate-300 my-1 bg-slate-900 py-1.5 rounded">
                        <span class="math-font text-fuchsia-400 text-sm">L</span> = 2<span class="math-font text-cyan-400 text-sm">λ</span><span class="math-font text-emerald-400 text-sm">D</span> / <span class="math-font text-fuchsia-400 text-sm">a</span>
                    </div>
                    <div class="text-right">
                        <span id="calc-L" class="font-mono text-xl font-black text-fuchsia-400">0.00</span> <span class="text-xs text-slate-500 font-bold">mm</span>
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <script>
        // === ETAT DE LA SIMULATION ===
        const state = {
            lambda: 632, // nm
            a: 0.10,     // mm
            d: 2.0       // m
        };

        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // Éléments UI
        const vLambda = document.getElementById('val-lambda');
        const vA = document.getElementById('val-a');
        const vD = document.getElementById('val-d');
        const cTheta = document.getElementById('calc-theta');
        const cL = document.getElementById('calc-L');

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            draw();
        }
        window.addEventListener('resize', resizeCanvas);

        // Conversion Longueur d'onde -> Couleur RGB
        function getLaserColor(lambda) {
            let R, G, B, alpha = 1.0;
            if (lambda >= 380 && lambda < 440) { R = -(lambda - 440) / (440 - 380); G = 0.0; B = 1.0; } 
            else if (lambda >= 440 && lambda < 490) { R = 0.0; G = (lambda - 440) / (490 - 440); B = 1.0; } 
            else if (lambda >= 490 && lambda < 510) { R = 0.0; G = 1.0; B = -(lambda - 510) / (510 - 490); } 
            else if (lambda >= 510 && lambda < 580) { R = (lambda - 510) / (580 - 510); G = 1.0; B = 0.0; } 
            else if (lambda >= 580 && lambda < 645) { R = 1.0; G = -(lambda - 645) / (645 - 580); B = 0.0; } 
            else if (lambda >= 645 && lambda <= 780) { R = 1.0; G = 0.0; B = 0.0; } 
            else { R = 0; G = 0; B = 0; }
            
            if (lambda >= 380 && lambda < 420) alpha = 0.3 + 0.7 * (lambda - 380) / (420 - 380);
            else if (lambda >= 701 && lambda <= 780) alpha = 0.3 + 0.7 * (780 - lambda) / (780 - 700);

            return {
                r: Math.round(R * 255), g: Math.round(G * 255), b: Math.round(B * 255),
                rgba: `rgba(${Math.round(R*255)}, ${Math.round(G*255)}, ${Math.round(B*255)}, ${alpha})`
            };
        }

        // Fonction d'intensité de diffraction (Sinc²)
        function getIntensity(y_meters, D_meters, a_meters, lambda_meters) {
            if (y_meters === 0) return 1.0;
            let sinTheta = y_meters / D_meters;
            let phi = (Math.PI * a_meters * sinTheta) / lambda_meters;
            let sinc = Math.sin(phi) / phi;
            return sinc * sinc;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const w = canvas.width;
            const h = canvas.height;
            const cy = h / 2;

            // Unités SI pour calculs
            let l_m = state.lambda * 1e-9;
            let a_m = state.a * 1e-3;
            let d_m = state.d;

            let colorObj = getLaserColor(state.lambda);

            // Calculs physiques
            let theta = l_m / a_m; // en rad
            let L_meters = (2 * l_m * d_m) / a_m;
            let L_mm = L_meters * 1000;

            // Mise à jour interface textuelle
            cTheta.innerText = theta.toExponential(2);
            cL.innerText = L_mm.toFixed(2);

            // --- RECOPIE DU SCHEMA DU TABLEAU ---
            // 1. Source Laser (à gauche)
            const laserX = 80;
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(laserX - 40, cy - 25, 90, 50);
            ctx.strokeStyle = '#475569';
            ctx.lineWidth = 2;
            ctx.strokeRect(laserX - 40, cy - 25, 90, 50);
            
            ctx.fillStyle = '#94a3b8';
            ctx.font = 'bold 13px sans-serif';
            ctx.fillText('Source lumineuse', laserX - 45, cy - 35);

            // 2. Obstacle / Fente 'a' (au milieu)
            const slitX = w * 0.35;
            ctx.fillStyle = '#334155';
            // Mur supérieur et inférieur
            let gap_px = Math.max(4, state.a * 80); // échelle visuelle
            ctx.fillRect(slitX - 6, 40, 12, cy - gap_px/2 - 40);
            ctx.fillRect(slitX - 6, cy + gap_px/2, 12, h - 40 - (cy + gap_px/2));

            // Annotation fente 'a'
            ctx.fillStyle = '#f0abfc'; // fuchsia
            ctx.fillText('fente a', slitX - 25, cy - gap_px/2 - 10);

            // 3. Écran (à droite)
            const screenX = w * 0.75;
            ctx.fillStyle = '#334155';
            ctx.fillRect(screenX - 4, 40, 8, h - 80);
            ctx.fillStyle = '#94a3b8';
            ctx.fillText('Écran', screenX - 15, h - 20);

            // 4. Rayon Laser incident
            ctx.beginPath();
            ctx.moveTo(laserX + 50, cy);
            ctx.lineTo(slitX - 6, cy);
            ctx.strokeStyle = colorObj.rgba;
            ctx.lineWidth = 3;
            ctx.shadowBlur = 12;
            ctx.shadowColor = colorObj.rgba;
            ctx.stroke();

            // 5. Faisceau diffracté conique (entre fente et écran)
            let halfL_px = (L_mm * 1.5); // Échelle visuelle de la tache sur l'écran
            ctx.beginPath();
            ctx.moveTo(slitX + 6, cy);
            ctx.lineTo(screenX, cy - halfL_px);
            ctx.lineTo(screenX, cy + halfL_px);
            ctx.closePath();
            ctx.fillStyle = colorObj.rgba;
            ctx.globalAlpha = 0.2;
            ctx.fill();
            ctx.globalAlpha = 1.0;
            ctx.shadowBlur = 0;

            // 6. Ligne de cote D (Distance fente-écran)
            ctx.beginPath();
            ctx.moveTo(slitX, h - 60);
            ctx.lineTo(screenX, h - 60);
            ctx.strokeStyle = '#34d399'; // vert émeraude
            ctx.lineWidth = 2;
            ctx.stroke();
            // Flèches D
            ctx.fillStyle = '#34d399';
            ctx.fillText('Distance D', (slitX + screenX)/2 - 35, h - 70);

            // 7. Dessin de l'Écart Angulaire θ et de la Tache L sur l'écran
            // Ligne de l'écart angulaire θ (du centre vers le haut de la tache centrale)
            ctx.beginPath();
            ctx.moveTo(slitX, cy);
            ctx.lineTo(screenX, cy - halfL_px);
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 1.5;
            ctx.setLineDash([4, 4]);
            ctx.stroke();
            ctx.setLineDash([]); // reset

            // Arc pour l'angle θ
            ctx.beginPath();
            ctx.arc(slitX, cy, 70, -Math.atan(halfL_px / (screenX - slitX)), 0, false);
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.fillStyle = '#38bdf8';
            ctx.fillText('θ (Écart angulaire)', slitX + 80, cy - 25);

            // Dessin de la figure de diffraction (Taches lumineuses réelles sur l'écran)
            const spotH = h - 80;
            ctx.shadowBlur = 15;
            ctx.shadowColor = colorObj.rgba;
            
            // Boucle verticale sur l'écran pour tracer l'intensité lumineuse
            for (let py = 40; py <= h - 40; py++) {
                let distFromCenter = py - cy;
                let y_meters = (distFromCenter / 150) * 0.01; // Échelle de conversion pixels -> mètres
                let I = getIntensity(y_meters, d_m, a_m, l_m);
                
                if (I > 0.01) {
                    ctx.globalAlpha = Math.min(1.0, I * 1.2);
                    ctx.fillStyle = colorObj.rgba;
                    ctx.fillRect(screenX - 15, py, 30, 1);
                }
            }
            ctx.globalAlpha = 1.0;
            ctx.shadowBlur = 0;

            // Cote L (Largeur de la tache centrale)
            ctx.beginPath();
            ctx.moveTo(screenX + 35, cy - halfL_px);
            ctx.lineTo(screenX + 35, cy + halfL_px);
            ctx.strokeStyle = '#f0abfc';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            ctx.fillStyle = '#f0abfc';
            ctx.fillText(`L = ${L_mm.toFixed(1)} mm`, screenX + 45, cy + 5);
        }

        // Écouteurs d'événements pour les curseurs (Boucle for classique stricte)
        const sliders = document.querySelectorAll('input[type=range]');
        for (let i = 0; i < sliders.length; i++) {
            sliders[i].addEventListener('input', function(e) {
                let key = e.target.getAttribute('data-key');
                let val = parseFloat(e.target.value);
                state[key] = val;

                if (key === 'lambda') vLambda.innerText = val + ' nm';
                if (key === 'a') vA.innerText = val.toFixed(2) + ' mm';
                if (key === 'd') vD.innerText = val.toFixed(1) + ' m';

                draw();
            });
        }

        // Lancement initial
        resizeCanvas();
    </script>
</body>
</html>
