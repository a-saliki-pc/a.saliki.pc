<!DOCTYPE html>
<html lang="fr" id="htmlRoot">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulations interactives — A SALIKI PC</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --noir-profond: #050b14;
      --bleu-nuit: #0a1428;
      --bleu-carte: #0f1e38;
      --bleu-bordure: #1a2f52;
      --cyan-neon: #22d3ee;
      --cyan-clair: #67e8f9;
      --vert-neon: #4ade80;
      --vert-fluo: #22c55e;
      --violet-tech: #8b5cf6;
      --or: #fbbf24;
      --rose: #f472b6;
      --rouge: #ef4444;
      --texte-principal: #ffffff;
      --texte-secondaire: #94a3b8;
      --texte-tertiaire: #cbd5e1;
      --fond-principal: #050b14;
      --fond-secondaire: #0a1428;
      --fond-carte: #0f1e38;
      --bordure: #1a2f52;
      --ombre-neon: 0 0 40px -10px rgba(34, 211, 238, 0.4);
      --rayon: 1rem;
      --rayon-petit: 0.6rem;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      --grille-couleur: rgba(34, 211, 238, 0.03);
    }
    [data-theme="light"] {
      --noir-profond: #f8fafc;
      --bleu-nuit: #ffffff;
      --bleu-carte: #ffffff;
      --bleu-bordure: #e2e8f0;
      --cyan-neon: #0891b2;
      --cyan-clair: #06b6d4;
      --vert-neon: #16a34a;
      --vert-fluo: #22c55e;
      --violet-tech: #7c3aed;
      --or: #d97706;
      --rose: #db2777;
      --rouge: #dc2626;
      --texte-principal: #0a1428;
      --texte-secondaire: #475569;
      --texte-tertiaire: #334155;
      --fond-principal: #f8fafc;
      --fond-secondaire: #ffffff;
      --fond-carte: #ffffff;
      --bordure: #e2e8f0;
      --ombre-neon: 0 10px 30px -10px rgba(8, 145, 178, 0.25);
      --grille-couleur: rgba(8, 145, 178, 0.05);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--fond-principal);
      color: var(--texte-tertiaire);
      line-height: 1.6;
      overflow-x: hidden;
      transition: background-color 0.4s ease, color 0.4s ease;
    }
    [dir="rtl"] body { font-family: 'Cairo', 'Inter', sans-serif; }
    h1, h2, h3, h4, .logo { font-family: 'Space Grotesk', sans-serif; letter-spacing: -0.02em; }
    [dir="rtl"] h1, [dir="rtl"] h2, [dir="rtl"] h3, [dir="rtl"] h4 { font-family: 'Cairo', sans-serif; letter-spacing: 0; }
    a { text-decoration: none; color: inherit; }
    .container { max-width: 1400px; margin: 0 auto; padding: 0 1.5rem; }
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image:
        linear-gradient(var(--grille-couleur) 1px, transparent 1px),
        linear-gradient(90deg, var(--grille-couleur) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
      z-index: 0;
    }
    section, header { position: relative; z-index: 1; }

    .header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(5, 11, 20, 0.9);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--bordure);
    }
    [data-theme="light"] .header { background: rgba(255, 255, 255, 0.9); }
    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.9rem 0;
      gap: 1rem;
    }
    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--texte-principal);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      white-space: nowrap;
    }
    .logo-icon {
      width: 38px; height: 38px;
      border-radius: 0.5rem;
      background: linear-gradient(135deg, var(--cyan-neon), var(--vert-neon));
      display: flex;
      align-items: center;
      justify-content: center;
      color: #050b14;
      font-size: 1.1rem;
      box-shadow: 0 0 20px -5px rgba(34, 211, 238, 0.7);
    }
    .logo span {
      background: linear-gradient(135deg, var(--cyan-neon), var(--vert-neon));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .nav-desktop { display: flex; align-items: center; gap: 0.1rem; }
    .nav-desktop a {
      padding: 0.5rem 0.85rem;
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--texte-secondaire);
      border-radius: 0.4rem;
      transition: var(--transition);
      white-space: nowrap;
    }
    .nav-desktop a:hover { color: var(--cyan-neon); background: rgba(34, 211, 238, 0.08); }
    .nav-desktop a.actif { color: var(--cyan-neon); background: rgba(34, 211, 238, 0.12); }
    .nav-desktop a.admin-link { color: var(--rose); }
    .header-actions { display: flex; align-items: center; gap: 0.5rem; }
    .lang-switcher {
      display: flex;
      background: rgba(34, 211, 238, 0.08);
      border: 1px solid var(--bordure);
      border-radius: 0.4rem;
      overflow: hidden;
    }
    .lang-btn {
      background: transparent;
      border: none;
      color: var(--texte-secondaire);
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.55rem 0.85rem;
      cursor: pointer;
      transition: var(--transition);
    }
    .lang-btn.actif {
      background: linear-gradient(135deg, var(--cyan-neon), var(--vert-neon));
      color: #050b14;
    }

    .hero-sim {
      padding: 3.5rem 0 2rem;
      text-align: center;
      position: relative;
    }
    .hero-sim::before {
      content: '';
      position: absolute;
      top: -50%; left: 50%;
      transform: translateX(-50%);
      width: 700px; height: 500px;
      background: radial-gradient(ellipse, rgba(139, 92, 246, 0.12), transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }
    .hero-sim h1 {
      font-size: 2.6rem;
      font-weight: 700;
      color: var(--texte-principal);
      margin-bottom: 0.6rem;
      position: relative;
    }
    .hero-sim h1 .accent {
      background: linear-gradient(135deg, var(--violet-tech), var(--cyan-neon));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .hero-sim p {
      color: var(--texte-secondaire);
      font-size: 1.05rem;
      max-width: 700px;
      margin: 0 auto;
      position: relative;
    }

    .filtres-bar {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      flex-wrap: wrap;
      margin: 2.5rem 0 2rem;
      padding: 0.5rem;
    }
    .filtre-btn {
      background: rgba(139, 92, 246, 0.05);
      border: 1px solid var(--bordure);
      color: var(--texte-secondaire);
      padding: 0.5rem 1.2rem;
      border-radius: 2rem;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }
    .filtre-btn:hover { color: var(--violet-tech); border-color: var(--violet-tech); }
    .filtre-btn.actif {
      background: linear-gradient(135deg, var(--violet-tech), var(--cyan-neon));
      color: #050b14;
      border-color: transparent;
      box-shadow: 0 0 20px -5px rgba(139, 92, 246, 0.6);
    }

    .sims-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
      margin-bottom: 4rem;
    }
    .sim-card {
      background: linear-gradient(160deg, var(--fond-carte), var(--fond-secondaire));
      border: 1px solid var(--bordure);
      border-radius: var(--rayon);
      padding: 1.5rem;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }
    .sim-card:hover {
      transform: translateY(-6px);
      border-color: rgba(139, 92, 246, 0.4);
      box-shadow: 0 0 40px -10px rgba(139, 92, 246, 0.4);
    }
    .sim-card .sim-icon {
      width: 50px; height: 50px;
      border-radius: 0.7rem;
      background: rgba(139, 92, 246, 0.1);
      border: 1px solid rgba(139, 92, 246, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      color: var(--violet-tech);
      transition: var(--transition);
    }
    .sim-card:hover .sim-icon {
      background: var(--violet-tech);
      color: #050b14;
      transform: scale(1.1) rotate(-8deg);
    }
    .sim-card .sim-chapitre {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--cyan-neon);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .sim-card h3 { font-size: 1.1rem; font-weight: 600; color: var(--texte-principal); line-height: 1.3; }
    .sim-card p { font-size: 0.85rem; color: var(--texte-secondaire); line-height: 1.5; flex: 1; }
    .sim-card .sim-lancer {
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.6rem 1rem;
      background: rgba(139, 92, 246, 0.08);
      border: 1px solid rgba(139, 92, 246, 0.3);
      color: var(--violet-tech);
      border-radius: 0.5rem;
      font-weight: 600;
      font-size: 0.82rem;
      transition: var(--transition);
      margin-top: 0.5rem;
    }
    .sim-card:hover .sim-lancer { background: var(--violet-tech); color: white; }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 11, 20, 0.9);
      backdrop-filter: blur(8px);
      z-index: 10000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      overflow-y: auto;
    }
    .modal-overlay.ouvert { display: flex; }
    .modal-sim {
      background: var(--fond-secondaire);
      border: 1px solid var(--bordure);
      border-radius: var(--rayon);
      width: 100%;
      max-width: 1100px;
      max-height: 95vh;
      overflow-y: auto;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
      animation: slideUp 0.3s ease;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.2rem 1.5rem;
      border-bottom: 1px solid var(--bordure);
      position: sticky;
      top: 0;
      background: var(--fond-secondaire);
      z-index: 10;
      border-radius: var(--rayon) var(--rayon) 0 0;
    }
    .modal-header h2 {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--texte-principal);
      display: flex;
      align-items: center;
      gap: 0.7rem;
    }
    .modal-header h2 i { color: var(--violet-tech); }
    .modal-close {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: var(--rouge);
      width: 38px; height: 38px;
      border-radius: 0.5rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      transition: var(--transition);
    }
    .modal-close:hover { background: var(--rouge); color: white; }
    .modal-body {
      padding: 1.5rem;
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      gap: 1.5rem;
    }
    @media (max-width: 900px) { .modal-body { grid-template-columns: 1fr; } }

    .sim-canvas-zone {
      background: var(--fond-principal);
      border: 1px solid var(--bordure);
      border-radius: var(--rayon-petit);
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .sim-canvas {
      width: 100%;
      height: 320px;
      background: #02060d;
      border-radius: 0.5rem;
      display: block;
      border: 1px solid var(--bordure);
    }
    [data-theme="light"] .sim-canvas { background: #0a1428; }
    .sim-controls {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
    }
    .sim-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 1.1rem;
      border-radius: 0.5rem;
      border: 1px solid var(--bordure);
      background: rgba(34, 211, 238, 0.08);
      color: var(--texte-principal);
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
    }
    .sim-btn:hover { border-color: var(--cyan-neon); color: var(--cyan-neon); }
    .sim-btn.primary {
      background: linear-gradient(135deg, var(--cyan-neon), var(--vert-neon));
      color: #050b14;
      border: none;
      font-weight: 600;
    }
    .sim-btn.primary:hover { box-shadow: 0 0 20px -5px rgba(34, 211, 238, 0.8); }
    .sim-btn.danger {
      background: rgba(239, 68, 68, 0.1);
      border-color: rgba(239, 68, 68, 0.3);
      color: var(--rouge);
    }

    .sim-sliders-zone { display: flex; flex-direction: column; gap: 1rem; }
    .sim-slider-group {
      background: var(--fond-principal);
      border: 1px solid var(--bordure);
      border-radius: var(--rayon-petit);
      padding: 1rem 1.2rem;
    }
    .sim-slider-group label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--texte-principal);
      margin-bottom: 0.6rem;
    }
    .sim-slider-group label span.value {
      color: var(--cyan-neon);
      font-family: 'Space Grotesk', monospace;
      background: rgba(34, 211, 238, 0.1);
      padding: 0.15rem 0.6rem;
      border-radius: 0.3rem;
      font-size: 0.8rem;
    }
    .sim-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: linear-gradient(90deg, var(--cyan-neon), var(--vert-neon));
      outline: none;
      cursor: pointer;
    }
    .sim-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--texte-principal);
      border: 3px solid var(--cyan-neon);
      cursor: pointer;
      box-shadow: 0 0 15px rgba(34, 211, 238, 0.8);
    }
    .sim-slider::-moz-range-thumb {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--texte-principal);
      border: 3px solid var(--cyan-neon);
      cursor: pointer;
    }

    .sim-resultats {
      background: var(--fond-principal);
      border: 1px solid var(--bordure);
      border-radius: var(--rayon-petit);
      padding: 1rem 1.2rem;
    }
    .sim-resultats h4 {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--or);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 0.6rem;
    }
    .sim-resultat-item {
      display: flex;
      justify-content: space-between;
      padding: 0.4rem 0;
      border-bottom: 1px dashed var(--bordure);
      font-size: 0.85rem;
    }
    .sim-resultat-item:last-child { border-bottom: none; }
    .sim-resultat-item .label { color: var(--texte-secondaire); }
    .sim-resultat-item .value {
      color: var(--cyan-neon);
      font-family: 'Space Grotesk', monospace;
      font-weight: 600;
    }

    .theme-toggle {
      position: fixed;
      bottom: 2rem; right: 2rem;
      width: 58px; height: 58px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--cyan-neon), var(--vert-neon));
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      color: #050b14;
      box-shadow: 0 8px 30px -5px rgba(34, 211, 238, 0.7);
      transition: var(--transition);
      z-index: 9999;
    }
    [dir="rtl"] .theme-toggle { right: auto; left: 2rem; }
    .theme-toggle:hover { transform: translateY(-4px) rotate(15deg) scale(1.05); }
    .theme-toggle .icon-sun { display: none; }
    [data-theme="light"] .theme-toggle .icon-sun { display: block; }
    [data-theme="light"] .theme-toggle .icon-moon { display: none; }

    @media (max-width: 768px) {
      .nav-desktop { display: none; }
      .hero-sim h1 { font-size: 1.9rem; }
      .sims-grid { grid-template-columns: 1fr; }
      .modal-header h2 { font-size: 1rem; }
      .modal-body { padding: 1rem; gap: 1rem; }
      .sim-canvas { height: 220px; }
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <span class="logo-icon"><i class="fas fa-atom"></i></span>
        A SALIKI <span>PC</span>
      </a>
      <nav class="nav-desktop">
        <a href="index.html" data-i18n="nav.home">Accueil</a>
        <a href="cours.html" data-i18n="nav.cours">Cours</a>
        <a href="exercices.html" data-i18n="nav.exercices">Exercices</a>
        <a href="examens.html" data-i18n="nav.examens">Examens</a>
        <a href="simulations.html" class="actif" data-i18n="nav.simulations">Simulations</a>
        <a href="qcm.html" data-i18n="nav.qcm">QCM</a>
        <a href="ressources.html" data-i18n="nav.ressources">Ressources</a>
        <a href="admin/login.html" class="admin-link" data-i18n="nav.admin">Admin</a>
      </nav>
      <div class="header-actions">
        <div class="lang-switcher">
          <button class="lang-btn actif" data-lang="fr">FR</button>
          <button class="lang-btn" data-lang="ar">AR</button>
        </div>
      </div>
    </div>
  </header>

  <section class="hero-sim">
    <div class="container">
      <h1><span data-i18n="sims.titre1">Simulations</span> <span class="accent" data-i18n="sims.titre2">interactives</span></h1>
      <p data-i18n="sims.desc">Explorez les phénomènes physiques et chimiques en modifiant les paramètres. Visualisez les effets en temps réel.</p>
    </div>
  </section>

  <div class="container">
    <div class="filtres-bar" id="filtresBar">
      <button class="filtre-btn actif" data-cat="all"><i class="fas fa-th"></i> <span data-i18n="filtre.tous">Tous</span></button>
      <button class="filtre-btn" data-cat="ondes"><i class="fas fa-water"></i> <span data-i18n="filtre.ondes">Ondes</span></button>
      <button class="filtre-btn" data-cat="cinetique"><i class="fas fa-hourglass-half"></i> <span data-i18n="filtre.cinetique">Cinétique</span></button>
      <button class="filtre-btn" data-cat="nucleaire"><i class="fas fa-radiation"></i> <span data-i18n="filtre.nucleaire">Nucléaire</span></button>
      <button class="filtre-btn" data-cat="mecanique"><i class="fas fa-rocket"></i> <span data-i18n="filtre.mecanique">Mécanique</span></button>
      <button class="filtre-btn" data-cat="electricite"><i class="fas fa-bolt"></i> <span data-i18n="filtre.electricite">Électricité</span></button>
    </div>

    <div class="sims-grid" id="simsGrid"></div>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-sim">
      <div class="modal-header">
        <h2><i class="fas fa-play-circle"></i> <span id="modalTitre">Simulation</span></h2>
        <button class="modal-close" id="modalClose"><i class="fas fa-times"></i></button>
      </div>
      <div class="modal-body">
        <div class="sim-canvas-zone">
          <canvas class="sim-canvas" id="simCanvas"></canvas>
          <div class="sim-controls">
            <button class="sim-btn primary" id="btnPlay"><i class="fas fa-play"></i> <span data-i18n="sim.play">Lancer</span></button>
            <button class="sim-btn" id="btnPause"><i class="fas fa-pause"></i> <span data-i18n="sim.pause">Pause</span></button>
            <button class="sim-btn danger" id="btnReset"><i class="fas fa-redo"></i> <span data-i18n="sim.reset">Reset</span></button>
          </div>
        </div>
        <div class="sim-sliders-zone">
          <div id="slidersContainer"></div>
          <div class="sim-resultats">
            <h4><i class="fas fa-chart-line"></i> <span data-i18n="sim.resultats">Résultats</span></h4>
            <div id="resultatsContainer"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <button class="theme-toggle" id="themeToggle">
    <i class="fas fa-moon icon-moon"></i>
    <i class="fas fa-sun icon-sun"></i>
  </button>

  <script>
    const simulations = [
      {
        id: 'ondes-corde', cat: 'ondes', icon: 'fa-water',
        titre_fr: 'Ondes mécaniques sur une corde', titre_ar: 'الموجات الميكانيكية على حبل',

    let currentLang = localStorage.getItem('asaliki-lang') || 'fr';
    let currentCat = 'all';
    let currentSim = null;
    let animationId = null;
    let isPaused = false;
    let simTime = 0;

    document.addEventListener('DOMContentLoaded', () => {
      appliquerTheme();
      afficherSims();
      bindEvents();
      appliquerLangue(currentLang);
    });

    function appliquerTheme() {
      const savedTheme = localStorage.getItem('asaliki-theme') || 'dark';
      document.getElementById('htmlRoot').setAttribute('data-theme', savedTheme);
    }

    function appliquerLangue(lang) {
      currentLang = lang;
      document.getElementById('htmlRoot').setAttribute('lang', lang);
      document.getElementById('htmlRoot').setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (trad[lang] && trad[lang][key]) el.textContent = trad[lang][key];
      });
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('actif', btn.getAttribute('data-lang') === lang);
      });
      localStorage.setItem('asaliki-lang', lang);
      afficherSims();
    }

    function bindEvents() {
      document.querySelectorAll('.filtre-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.filtre-btn').forEach(b => b.classList.remove('actif'));
          btn.classList.add('actif');
          currentCat = btn.getAttribute('data-cat');
          afficherSims();
        });
      });
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', () => appliquerLangue(btn.getAttribute('data-lang')));
      });
      document.getElementById('themeToggle').addEventListener('click', () => {
        const current = document.getElementById('htmlRoot').getAttribute('data-theme');
        const next = current === 'dark' ? 'light' : 'dark';
        document.getElementById('htmlRoot').setAttribute('data-theme', next);
        localStorage.setItem('asaliki-theme', next);
      });
      document.getElementById('modalClose').addEventListener('click', fermerModal);
      document.getElementById('modalOverlay').addEventListener('click', (e) => {
        if (e.target.id === 'modalOverlay') fermerModal();
      });
      document.getElementById('btnPlay').addEventListener('click', () => { isPaused = false; });
      document.getElementById('btnPause').addEventListener('click', () => { isPaused = true; });
      document.getElementById('btnReset').addEventListener('click', () => {
        simTime = 0;
        isPaused = false;
        if (currentSim) demarrerSimulation(currentSim);
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') fermerModal();
      });
    }

    function afficherSims() {
      const grid = document.getElementById('simsGrid');
      grid.innerHTML = '';
      const filtered = currentCat === 'all' ? simulations : simulations.filter(s => s.cat === currentCat);

      filtered.forEach(sim => {
        const card = document.createElement('div');
        card.className = 'sim-card';
        const titre = currentLang === 'fr' ? sim.titre_fr : sim.titre_ar;
        const desc = currentLang === 'fr' ? sim.desc_fr : sim.desc_ar;
        const chap = currentLang === 'fr' ? sim.chapitre_fr : sim.chapitre_ar;

        card.innerHTML = `
          <div class="sim-icon"><i class="fas ${sim.icon}"></i></div>
          <div class="sim-chapitre">${chap}</div>
          <h3>${titre}</h3>
          <p>${desc}</p>
          <div class="sim-lancer">
            <span>${trad[currentLang]['sim.lancer']}</span>
            <i class="fas fa-arrow-right"></i>
          </div>
        `;
        card.addEventListener('click', () => ouvrirModal(sim));
        grid.appendChild(card);
      });
    }

    function ouvrirModal(sim) {
      currentSim = sim;
      const titre = currentLang === 'fr' ? sim.titre_fr : sim.titre_ar;
      document.getElementById('modalTitre').textContent = titre;
      document.getElementById('modalOverlay').classList.add('ouvert');

      construireSliders(sim);
      simTime = 0;
      isPaused = false;

      setTimeout(() => demarrerSimulation(sim), 100);
    }

    function fermerModal() {
      document.getElementById('modalOverlay').classList.remove('ouvert');
      if (animationId) cancelAnimationFrame(animationId);
      animationId = null;
      currentSim = null;
    }

    function construireSliders(sim) {
      const container = document.getElementById('slidersContainer');
      container.innerHTML = '';
      sim.params = sim.params || {};
      sim.sliders.forEach(slider => {
        const group = document.createElement('div');
        group.className = 'sim-slider-group';
        const label = currentLang === 'fr' ? slider.label_fr : slider.label_ar;
        group.innerHTML = `
          <label>
            <span>${label}</span>
            <span class="value" id="val-${slider.id}">${slider.value} ${slider.unit}</span>
          </label>
          <input type="range" class="sim-slider" id="slider-${slider.id}"
                 min="${slider.min}" max="${slider.max}" step="${slider.step}" value="${sim.params[slider.id] || slider.value}">
        `;
        container.appendChild(group);

        const input = group.querySelector('input');
        input.addEventListener('input', (e) => {
          const val = parseFloat(e.target.value);
          document.getElementById(`val-${slider.id}`).textContent = val + ' ' + slider.unit;
          sim.params[slider.id] = val;
          mettreAJourResultats(sim);
        });

        if (sim.params[slider.id] === undefined) sim.params[slider.id] = slider.value;
      });
    }

    function mettreAJourResultats(sim) {
      const container = document.getElementById('resultatsContainer');
      container.innerHTML = '';
      const results = calculerResultats(sim);
      results.forEach(r => {
        const div = document.createElement('div');
        div.className = 'sim-resultat-item';
        div.innerHTML = `<span class="label">${r.label}</span><span class="value">${r.value}</span>`;
        container.appendChild(div);
      });
    }

    function calculerResultats(sim) {
      const p = sim.params || {};
      const results = [];
      if (sim.id === 'ondes-corde') {
        const lambda = p.vit / p.freq;
        results.push({ label: 'λ', value: lambda.toFixed(3) + ' m' });
        results.push({ label: 'T', value: (1/p.freq).toFixed(3) + ' s' });
      } else if (sim.id === 'diffraction') {
        const theta = Math.asin(Math.min(1, (p.lambda*1e-9)/(p.largeur*1e-6)));
        results.push({ label: 'θ', value: (theta * 180/Math.PI).toFixed(2) + ' °' });
      } else if (sim.id === 'cinetique') {
        const k = 0.02 * Math.exp(50 * (1/298 - 1/p.temp));
        results.push({ label: 'k', value: k.toExponential(3) + ' s⁻¹' });
        results.push({ label: 't₁/₂', value: (Math.log(2)/k).toFixed(1) + ' s' });
      } else if (sim.id === 'nucleaire') {
        results.push({ label: 'T₁/₂', value: (Math.log(2)/p.lambda).toFixed(3) + ' s' });
        results.push({ label: 'A₀', value: (p.lambda * p.n0).toFixed(2) + ' Bq' });
      } else if (sim.id === 'chute-libre') {
        const g = 9.81;
        const tf = (-p.v0 + Math.sqrt(p.v0*p.v0 + 2*g*p.hauteur)) / g;
        results.push({ label: 't finale', value: tf.toFixed(3) + ' s' });
        results.push({ label: 'v finale', value: (p.v0 + g*tf).toFixed(2) + ' m/s' });
      } else if (sim.id === 'dipole-rc') {
        const tau = p.R * p.C * 1e-6;
        results.push({ label: 'τ', value: (tau*1000).toFixed(3) + ' ms' });
      } else if (sim.id === 'rlc') {
        const omega0 = 1/Math.sqrt(p.L * p.C * 1e-6);
        results.push({ label: 'T₀', value: (2*Math.PI/omega0*1000).toFixed(2) + ' ms' });
        results.push({ label: 'α', value: (p.R/(2*p.L)).toFixed(1) + ' s⁻¹' });
      } else if (sim.id === 'oscillateur') {
        const T = 2*Math.PI*Math.sqrt(p.masse/p.k);
        results.push({ label: 'T', value: T.toFixed(3) + ' s' });
        results.push({ label: 'ω', value: Math.sqrt(p.k/p.masse).toFixed(3) + ' rad/s' });
      }
      return results;
    }

    function demarrerSimulation(sim) {
      if (animationId) cancelAnimationFrame(animationId);
      const canvas = document.getElementById('simCanvas');
      const ctx = canvas.getContext('2d');
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * window.devicePixelRatio;
      canvas.height = rect.height * window.devicePixelRatio;
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);

      function loop() {
        if (!isPaused) {
          simTime += 0.016;
          if (simTime > 20) simTime = 0;
        }
        ctx.clearRect(0, 0, rect.width, rect.height);
        sim.draw(ctx, rect.width, rect.height, sim.params, simTime);
        animationId = requestAnimationFrame(loop);
      }
      loop();
      mettreAJourResultats(sim);
    }

    function drawOndesCorde(ctx, w, h, p, t) {
      const cy = h / 2;
      const lambda = p.vit / p.freq;
      const k = 2 * Math.PI / lambda;
      ctx.strokeStyle = 'rgba(34, 211, 238, 0.2)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, cy);
      ctx.lineTo(w, cy);
      ctx.stroke();
      ctx.strokeStyle = '#22d3ee';
      ctx.lineWidth = 3;
      ctx.shadowColor = '#22d3ee';
      ctx.shadowBlur = 15;
      ctx.beginPath();
      for (let x = 0; x < w; x++) {
        const y = cy - p.amp * Math.sin(k * x / 40 - 2 * Math.PI * p.freq * t);
        if (x === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    function drawDiffraction(ctx, w, h, p, t) {
      const cx = w / 2;
      const cy = h / 2;
      const largeurPx = p.largeur / 3;
      ctx.fillStyle = 'rgba(34, 211, 238, 0.15)';
      ctx.fillRect(0, cy - 150, cx - largeurPx/2, 300);
      ctx.fillRect(cx + largeurPx/2, cy - 150, cx, 300);
      ctx.fillStyle = '#22d3ee';
      ctx.fillRect(cx - largeurPx/2 - 3, 0, 3, h);
      ctx.fillRect(cx + largeurPx/2, 0, 3, h);
      const lambdaNorm = p.lambda / 700;
      for (let i = -8; i <= 8; i++) {
        const angle = i * lambdaNorm * 0.15;
        ctx.strokeStyle = `rgba(74, 222, 128, ${0.6 - Math.abs(i) * 0.05})`;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + Math.sin(angle) * w * 1.5, cy + Math.cos(angle) * h * 1.5);
        ctx.stroke();
      }
    }

    function drawCinetique(ctx, w, h, p, t) {
      const padding = 40;
      const graphW = w - padding * 2;
      const graphH = h - padding * 2;
      ctx.strokeStyle = 'rgba(34, 211, 238, 0.3)';
      ctx.beginPath();
      ctx.moveTo(padding, padding);
      ctx.lineTo(padding, h - padding);
      ctx.lineTo(w - padding, h - padding);
      ctx.stroke();
      const k = 0.02 * Math.exp(50 * (1/298 - 1/p.temp));
      const maxT = 100;
      ctx.strokeStyle = '#4ade80';
      ctx.lineWidth = 3;
      ctx.shadowColor = '#4ade80';
      ctx.shadowBlur = 12;
      ctx.beginPath();
      for (let i = 0; i <= 100; i++) {
        const time = (i / 100) * maxT;
        const c = p.c0 * Math.exp(-k * time);
        const x = padding + (time / maxT) * graphW;
        const y = h - padding - (c / p.c0) * graphH;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    function drawNucleaire(ctx, w, h, p, t) {
      const padding = 40;
      const graphW = w - padding * 2;
      const graphH = h - padding * 2;
      ctx.strokeStyle = 'rgba(34, 211, 238, 0.3)';
      ctx.beginPath();
      ctx.moveTo(padding, padding);
      ctx.lineTo(padding, h - padding);
      ctx.lineTo(w - padding, h - padding);
      ctx.stroke();
      const maxT = 20;
      ctx.strokeStyle = '#22d3ee';
      ctx.lineWidth = 3;
      ctx.shadowColor = '#22d3ee';
      ctx.shadowBlur = 12;
      ctx.beginPath();
      for (let i = 0; i <= 100; i++) {
        const time = (i / 100) * maxT;
        const n = p.n0 * Math.exp(-p.lambda * time);
        const x = padding + (time / maxT) * graphW;
        const y = h - padding - (n / p.n0) * graphH;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    function drawChuteLibre(ctx, w, h, p, t) {
      const g = 9.81;
      const cy = 40;
      const sol = h - 40;
      ctx.fillStyle = 'rgba(34, 211, 238, 0.2)';
      ctx.fillRect(0, sol, w, h - sol);
      ctx.fillStyle = '#22d3ee';
      ctx.fillRect(0, sol, w, 3);
      const tf = (-p.v0 + Math.sqrt(p.v0*p.v0 + 2*g*p.hauteur)) / g;
      const tCycle = (t % (tf + 1));
      let yPos = tCycle < tf ? p.v0 * tCycle + 0.5 * g * tCycle * tCycle : p.hauteur;
      const ratio = Math.min(1, yPos / p.hauteur);
      const yPx = cy + ratio * (sol - cy);
      ctx.fillStyle = '#4ade80';
      ctx.shadowColor = '#4ade80';
      ctx.shadowBlur = 20;
      ctx.beginPath();
      ctx.arc(w/2, yPx, 15 + p.masse * 2, 0, 2 * Math.PI);
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    function drawDipoleRC(ctx, w, h, p, t) {
      const tau = p.R * p.C * 1e-6;
      const padding = 40;
      const graphW = w - padding * 2;
      const graphH = h - padding * 2;
      ctx.strokeStyle = 'rgba(34, 211, 238, 0.3)';
      ctx.beginPath();
      ctx.moveTo(padding, padding);
      ctx.lineTo(padding, h - padding);
      ctx.lineTo(w - padding, h - padding);
      ctx.stroke();
      const maxT = 5 * tau;
      ctx.strokeStyle = '#4ade80';
      ctx.lineWidth = 3;
      ctx.shadowColor = '#4ade80';
      ctx.shadowBlur = 12;
      ctx.beginPath();
      for (let i = 0; i <= 100; i++) {
        const time = (i / 100) * maxT;
        const uc = p.E * (1 - Math.exp(-time / tau));
        const x = padding + (time / maxT) * graphW;
        const y = h - padding - (uc / p.E) * graphH;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    function drawRLC(ctx, w, h, p, t) {
      const L = p.L;
      const C = p.C * 1e-6;
      const omega0 = 1 / Math.sqrt(L * C);
      const alpha = p.R / (2 * L);
      const omega = Math.sqrt(Math.max(0, omega0 * omega0 - alpha * alpha));
      const padding = 40;
      const graphW = w - padding * 2;
      const graphH = h - padding * 2;
      ctx.strokeStyle = 'rgba(34, 211, 238, 0.3)';
      ctx.beginPath();
      ctx.moveTo(padding, h/2);
      ctx.lineTo(w - padding, h/2);
      ctx.stroke();
      const maxT = 0.05;
      ctx.strokeStyle = '#22d3ee';
      ctx.lineWidth = 2.5;
      ctx.shadowColor = '#22d3ee';
      ctx.shadowBlur = 15;
      ctx.beginPath();
      for (let i = 0; i <= 200; i++) {
        const time = (i / 200) * maxT;
        const q = Math.exp(-alpha * time) * Math.cos(omega * time);
        const x = padding + (time / maxT) * graphW;
        const y = h/2 - q * (h/2 - padding) * 0.8;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    function drawOscillateur(ctx, w, h, p, t) {
      const omega = Math.sqrt(p.k / p.masse);
      const cy = h/2 + 30;
      ctx.fillStyle = 'rgba(34, 211, 238, 0.3)';
      ctx.fillRect(w/2 - 80, 40, 160, 10);
      const y = cy - p.amp * Math.cos(omega * t * 2);
      ctx.strokeStyle = '#22d3ee';
      ctx.lineWidth = 2;
      ctx.beginPath();
      const segments = 15;
      for (let i = 0; i <= segments; i++) {
        const yy = 50 + (y - 50) * (i / segments);
        const xx = w/2 + (i % 2 === 0 ? -15 : 15);
        if (i === 0) ctx.moveTo(w/2, 50);
        else ctx.lineTo(xx, yy);
      }
      ctx.lineTo(w/2, y);
      ctx.stroke();
      ctx.fillStyle = '#4ade80';
      ctx.shadowColor = '#4ade80';
      ctx.shadowBlur = 20;
      ctx.beginPath();
      ctx.arc(w/2, y, 20 + p.masse * 3, 0, 2 * Math.PI);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  </script>
