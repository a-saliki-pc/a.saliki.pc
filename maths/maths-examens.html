<!DOCTYPE html>
<html lang="fr" dir="ltr" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Examens de Mathématiques | DARRSSY Maths</title>
<link rel="icon" type="image/png" href="../assets/logo-darrssy.png">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root { 
  --primary: #16213e; --primary-light: #2a9d8f; --accent: #e8a33d; --accent-dark: #c17f1e;
  --ink: #16213e; --gray: #5b6b7a; --gray-light: #93a3b0; --border: #d9d2bb; --light: #faf6ec; --white: #fffdf7;
  --shadow: 6px 6px 0 rgba(22,33,62,0.08); --shadow-lg: 10px 10px 0 rgba(22,33,62,0.1);
  --radius: 6px; --radius-sm: 4px; --transition: all 0.25s ease;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', 'Tajawal', sans-serif; background: linear-gradient(rgba(22,33,62,0.1) 0.5px, transparent 0.5px), linear-gradient(90deg, rgba(22,33,62,0.1) 0.5px, transparent 0.5px), linear-gradient(rgba(22,33,62,0.028) 0.5px, transparent 0.5px), linear-gradient(90deg, rgba(22,33,62,0.028) 0.5px, transparent 0.5px), var(--light); background-size: 50px 50px, 50px 50px, 10px 10px, 10px 10px, auto; color: var(--ink); line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column; }
[dir="rtl"] body { font-family: 'Tajawal', 'Inter', sans-serif; }
a { text-decoration: none; color: inherit; }
h1, h2, h3 { font-family: 'Fraunces', 'Tajawal', serif; }

nav { background: var(--white); border-bottom: 2px solid var(--ink); padding: 10px 5%; display: flex; justify-content: space-between; align-items: center; position: relative; }
.logo { display: flex; align-items: center; gap: 12px; }
.logo-img-wrap { width: 40px; height: 40px; border-radius: 50%; background: var(--white); padding: 2px; border: 2px solid var(--ink); }
.logo-img-wrap img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
.logo-texte .titre { font-family: 'Fraunces', serif; font-size: 1.2rem; font-weight: 700; }
.nav-right { display: flex; align-items: center; gap: 10px; }
.lang-switcher { display: flex; background: var(--white); border: 2px solid var(--ink); border-radius: var(--radius-sm); overflow: hidden; }
.lang-btn { background: transparent; border: none; color: var(--ink); font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; font-weight: 700; padding: 6px 12px; cursor: pointer; transition: var(--transition); }
.lang-btn.actif { background: var(--ink); color: var(--white); }
.btn-back { background: var(--ink); color: var(--white); padding: 8px 18px; border-radius: var(--radius-sm); font-weight: 600; font-size: 0.9rem; transition: var(--transition); display: flex; align-items: center; gap: 6px; border: 2px solid var(--ink); }
.btn-back:hover { background: var(--white); color: var(--ink); }
.btn-back.secondary { background: transparent; color: var(--ink); border-color: var(--ink); }
.btn-back.secondary:hover { background: var(--ink); color: var(--white); }

/* NAV LINKS */
.nav-links { display: flex; gap: 18px; list-style: none; align-items: center; margin: 0; padding: 0; }
.nav-links a { color: var(--ink); font-weight: 500; font-size: 0.92rem; transition: color 0.25s; position: relative; padding: 4px 0; }
.nav-links a:hover, .nav-links a.actif { color: var(--primary-light); }
.nav-links a::after { content: ''; position: absolute; bottom: 0; left: 0; width: 0; height: 2px; background: var(--accent); transition: width 0.25s; }
.nav-links a:hover::after, .nav-links a.actif::after { width: 100%; }
.nav-links a.actif { font-weight: 700; }
.menu-toggle { display: none; font-size: 1.3rem; cursor: pointer; color: var(--ink); background: none; border: none; padding: 5px; }

@media (max-width: 991px) {
  .menu-toggle { display: block; }
  .nav-links {
    position: absolute; top: 100%; left: 0; right: 0;
    background: var(--white);
    flex-direction: column;
    padding: 20px; gap: 15px;
    border-bottom: 2px solid var(--ink);
    box-shadow: var(--shadow-lg);
    display: none;
    z-index: 1000;
  }
  .nav-links.active { display: flex; }
  .nav-links a { font-size: 1rem; width: 100%; text-align: center; }
}

.main-content { flex: 1; padding: 40px 5%; max-width: 1000px; margin: 0 auto; width: 100%; }
.page-title { text-align: center; margin-bottom: 30px; }
.page-title h1 { font-size: 2.2rem; margin-bottom: 10px; }
.page-title p { color: var(--gray); }

.level-filters { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 40px; }
.level-btn { background: var(--white); border: 2px solid var(--ink); color: var(--ink); padding: 10px 20px; border-radius: 50px; font-family: inherit; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: var(--transition); }
.level-btn:hover { background: var(--light); }
.level-btn.actif { background: var(--ink); color: var(--white); }

.level-section { display: none; animation: fadeIn 0.4s ease; }
.level-section.actif { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

/* CARTE EXAMEN */
.exo-card { background: var(--white); border: 2px solid var(--ink); border-radius: var(--radius); margin-bottom: 20px; box-shadow: var(--shadow); overflow: hidden; transition: var(--transition); display: flex; flex-direction: column; }
.exo-card:hover { box-shadow: var(--shadow-lg); border-color: var(--primary-light); }
.exo-banner { height: 80px; padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; position: relative; background: var(--primary); color: var(--white); }
.exo-icon-type { width: 45px; height: 45px; border-radius: var(--radius-sm); background: rgba(255,255,255,0.1); border: 1.5px solid rgba(255,255,255,0.3); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; color: var(--accent); }
.annee-badge { background: var(--accent); color: var(--ink); padding: 5px 12px; border-radius: 3px; font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; font-weight: 800; }
.exo-body { padding: 20px; flex: 1; display: flex; flex-direction: column; gap: 15px; }
.exo-titre { font-size: 1.1rem; font-weight: 600; color: var(--ink); }
.exo-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.btn-pdf { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 15px; border-radius: var(--radius-sm); font-weight: 600; font-size: 0.85rem; transition: var(--transition); text-decoration: none; border: 2px solid; flex: 1; min-width: 130px; }
.btn-pdf.sujet { background: var(--light); border-color: var(--ink); color: var(--ink); }
.btn-pdf.sujet:hover { background: var(--ink); color: var(--white); }
.btn-pdf.corrige { background: var(--primary-light); border-color: var(--primary-light); color: var(--white); }
.btn-pdf.corrige:hover { background: #1e7a6f; border-color: #1e7a6f; }
.btn-pdf.disabled { background: var(--light); border-color: var(--border); color: var(--gray-light); cursor: not-allowed; opacity: 0.6; }

.loading-zone { text-align: center; padding: 60px 20px; color: var(--gray); }
.loading-zone i { font-size: 2.1rem; color: var(--primary-light); animation: spin 1s linear infinite; display: block; margin-bottom: 15px; }
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

@media (max-width: 768px) {
  nav { padding: 10px 3%; }
  .logo-img-wrap { width: 35px; height: 35px; }
  .logo-texte .titre { font-size: 1rem; }
  .btn-back span { display: none; }
  .btn-back { padding: 8px 12px; font-size: 0.8rem; }
  .lang-btn { padding: 6px 8px; font-size: 0.7rem; }
  .main-content { padding: 20px 4%; }
  .page-title h1 { font-size: 1.6rem; }
  .level-filters { gap: 5px; }
  .level-btn { padding: 8px 12px; font-size: 0.8rem; }
  .exo-actions { flex-direction: column; }
  .btn-pdf { min-width: 100%; }
}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="logo">
    <div class="logo-img-wrap"><img src="../assets/logo-darrssy.png" alt="DARRSSY"></div>
    <div class="logo-texte"><span class="titre">DARRSSY Maths</span></div>
  </a>
  <ul class="nav-links" id="navLinks">
    <li><a href="index.html" data-i18n="nav.maths_home">Accueil</a></li>
    <li><a href="maths-cours.html" data-i18n="nav.cours">Cours</a></li>
    <li><a href="maths-exercices.html" data-i18n="nav.exercices">Exercices</a></li>
    <li><a href="maths-examens.html" class="actif" data-i18n="nav.examens">Examens</a></li>
    <li><a href="traceur-graphe.html" data-i18n="nav.traceur">Traceur</a></li>
    <li><a href="calculateur-limites.html" data-i18n="nav.limites">Limites</a></li>
    <li><a href="maths-formules.html" data-i18n="nav.formules">Formules</a></li>
  </ul>
  <div class="nav-right">
    <div class="lang-switcher">
      <button class="lang-btn actif" data-lang="fr">FR</button>
      <button class="lang-btn" data-lang="ar">AR</button>
    </div>
    <a href="../index.html" class="btn-back"><i class="fas fa-home"></i> <span data-i18n="nav.home">Site</span></a>
    <button class="menu-toggle" id="menuToggle" aria-label="Menu"><i class="fas fa-bars"></i></button>
  </div>
</nav>

<div class="main-content">
  <div class="page-title">
    <h1 data-i18n="title">Examens de Mathématiques</h1>
    <p data-i18n="desc">Téléchargez les sujets et corrigés des examens nationaux et régionaux.</p>
  </div>

  <div class="level-filters">
    <button class="level-btn actif" data-level="tronc" data-i18n="lvl.tronc">Tronc Commun</button>
    <button class="level-btn" data-level="1bac" data-i18n="lvl.1bac">1ère Année Bac</button>
    <button class="level-btn" data-level="2bac" data-i18n="lvl.2bac">2ème Année Bac</button>
  </div>

  <div class="level-section actif" id="level-tronc">
    <div id="exams-tronc" class="loading-zone"><i class="fas fa-spinner"></i><p data-i18n="loading">Chargement...</p></div>
  </div>
  <div class="level-section" id="level-1bac">
    <div id="exams-1bac" class="loading-zone"><i class="fas fa-spinner"></i><p data-i18n="loading">Chargement...</p></div>
  </div>
  <div class="level-section" id="level-2bac">
    <div id="exams-2bac" class="loading-zone"><i class="fas fa-spinner"></i><p data-i18n="loading">Chargement...</p></div>
  </div>
</div>

<script src="../admin/darrssy-config.js"></script>
<script>
let currentLang = localStorage.getItem('darrssy-lang') || 'fr';
let tousLesExamens = [];

const trad = {
  fr: {
    'nav.menu': 'Menu', 'nav.home': 'Site', 'nav.maths_home': 'Accueil', 'nav.cours': 'Cours', 'nav.exercices': 'Exercices', 'nav.examens': 'Examens', 'nav.traceur': 'Traceur', 'nav.limites': 'Limites', 'nav.formules': 'Formules', 'title': 'Examens de Mathématiques', 'desc': 'Téléchargez les sujets et corrigés des examens.',
    'lvl.tronc': 'Tronc Commun', 'lvl.1bac': '1ère Année Bac', 'lvl.2bac': '2ème Année Bac',
    'loading': 'Chargement...', 'noExam': 'Aucun examen disponible pour ce niveau pour le moment.',
    'type.controle': 'Contrôle', 'type.regional': 'Régional', 'type.national': 'National',
    'btn.sujet': 'Télécharger le sujet', 'btn.corrige': 'Télécharger le corrigé', 'btn.indispo': 'Indisponible'
  },
  ar: {
    'nav.menu': 'القائمة', 'nav.home': 'الموقع', 'nav.maths_home': 'الرئيسية', 'nav.cours': 'الدروس', 'nav.exercices': 'التمارين', 'nav.examens': 'الامتحانات', 'nav.traceur': 'راسم الدوال', 'nav.limites': 'حاسبة النهايات', 'nav.formules': 'الصيغ', 'title': 'امتحانات الرياضيات', 'desc': 'قم بتحميل مواضيع وحلول الامتحانات.',
    'lvl.tronc': 'الجذع المشترك', 'lvl.1bac': 'الأولى باكالوريا', 'lvl.2bac': 'الثانية باكالوريا',
    'loading': 'جارٍ التحميل...', 'noExam': 'لا يوجد أي امتحان متاح لهذا المستوى حالياً.',
    'type.controle': 'فرض', 'type.regional': 'جهوي', 'type.national': 'وطني',
    'btn.sujet': 'تحميل الموضوع', 'btn.corrige': 'تحميل التصحيح', 'btn.indispo': 'غير متوفر'
  }
};

document.addEventListener('DOMContentLoaded', async () => {
  appliquerLangue(currentLang);
  bindEvents();
  await chargerExamens();
});

function appliquerLangue(lang) {
  currentLang = lang;
  document.getElementById('htmlRoot').setAttribute('lang', lang);
  document.getElementById('htmlRoot').setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (trad[lang] && trad[lang][key]) el.innerHTML = trad[lang][key];
  });
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('actif', btn.getAttribute('data-lang') === lang);
  });
  localStorage.setItem('darrssy-lang', lang);
  if (tousLesExamens.length > 0) afficherExamens();
}

function bindEvents() {
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', () => appliquerLangue(btn.getAttribute('data-lang')));
  });
  document.querySelectorAll('.level-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.level-btn').forEach(b => b.classList.remove('actif'));
      btn.classList.add('actif');
      document.querySelectorAll('.level-section').forEach(s => s.classList.remove('actif'));
      document.getElementById('level-' + btn.getAttribute('data-level')).classList.add('actif');
    });
  });
  const menuToggle = document.getElementById('menuToggle');
  const navLinks = document.getElementById('navLinks');
  if (menuToggle && navLinks) {
    menuToggle.addEventListener('click', () => {
      navLinks.classList.toggle('active');
      const icon = menuToggle.querySelector('i');
      if (icon) {
        if (navLinks.classList.contains('active')) {
          icon.classList.remove('fa-bars');
          icon.classList.add('fa-times');
        } else {
          icon.classList.remove('fa-times');
          icon.classList.add('fa-bars');
        }
      }
    });
  }
}

async function chargerExamens() {
  try {
    if (typeof lireTable !== 'function') throw new Error("lireTable non chargé");
    // On récupère uniquement les examens de la matière "maths"
    tousLesExamens = await lireTable('examens', { 
      filtres: { publie: true, matiere: 'maths' }, 
      ordre: { col: 'annee', asc: false } 
    });
    afficherExamens();
  } catch (err) {
    console.error(err);
    document.getElementById('exams-tronc').innerHTML = `<p style="color:red;">Erreur de chargement: ${err.message}</p>`;
  }
}

function afficherExamens() {
  const containers = {
    tronc: document.getElementById('exams-tronc'),
    '1bac': document.getElementById('exams-1bac'),
    '2bac': document.getElementById('exams-2bac')
  };
  
  Object.values(containers).forEach(c => c.innerHTML = '');

  if (tousLesExamens.length === 0) {
    containers['tronc'].innerHTML = `<p>${trad[currentLang]['noExam']}</p>`;
    return;
  }

  tousLesExamens.forEach(ex => {
    let niveau = ex.niveau;
    let container = containers[niveau];
    
    if (niveau === '2bacpc' || niveau === '2bacsvt') container = containers['2bac'];
    if (!container) return; 

    const titre = currentLang === 'fr' ? ex.titre_fr : (ex.titre_ar || ex.titre_fr);
    const typeLabel = trad[currentLang]['type.' + ex.type] || ex.type;
    
    let btnSujet = ex.fichier_url 
      ? `<a href="${ex.fichier_url}" target="_blank" class="btn-pdf sujet"><i class="fas fa-file-pdf"></i> ${trad[currentLang]['btn.sujet']}</a>`
      : `<button class="btn-pdf disabled"><i class="fas fa-file-pdf"></i> ${trad[currentLang]['btn.indispo']}</button>`;
      
    let btnCorrige = ex.fichier_corrige_url 
      ? `<a href="${ex.fichier_corrige_url}" target="_blank" class="btn-pdf corrige"><i class="fas fa-check-circle"></i> ${trad[currentLang]['btn.corrige']}</a>`
      : `<button class="btn-pdf disabled"><i class="fas fa-check-circle"></i> ${trad[currentLang]['btn.indispo']}</button>`;

    const card = document.createElement('div');
    card.className = 'exo-card';
    card.innerHTML = `
      <div class="exo-banner">
        <div class="exo-icon-type"><i class="fas fa-file-signature"></i></div>
        <div class="annee-badge">${ex.annee}</div>
      </div>
      <div class="exo-body">
        <div style="font-size:0.75rem; font-weight:700; color:var(--accent-dark); text-transform:uppercase; font-family:'JetBrains Mono';">${typeLabel}</div>
        <div class="exo-titre">${titre}</div>
        <div class="exo-actions">
          ${btnSujet}
          ${btnCorrige}
        </div>
      </div>
    `;
    container.appendChild(card);
  });
  
  Object.keys(containers).forEach(k => {
    if (containers[k].innerHTML === '') {
      containers[k].innerHTML = `<p style="color:var(--gray);">${trad[currentLang]['noExam']}</p>`;
    }
  });
}
</script>
<script data-goatcounter="https://darrssy.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
