<!DOCTYPE html>
<html lang="fr" dir="ltr" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculateur de limites | DARRSSY Maths</title>
<link rel="icon" type="image/png" href="../assets/logo-darrssy.png">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
<style>
:root { --primary: #16213e; --primary-light: #2a9d8f; --accent: #e8a33d; --ink: #16213e; --gray: #5b6b7a; --gray-light: #93a3b0; --border: #d9d2bb; --light: #faf6ec; --white: #fffdf7; --shadow: 6px 6px 0 rgba(22,33,62,0.08); --shadow-lg: 10px 10px 0 rgba(22,33,62,0.1); --radius: 6px; --radius-sm: 4px; --transition: all 0.25s ease; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', 'Tajawal', sans-serif; background: linear-gradient(rgba(22,33,62,0.1) 0.5px, transparent 0.5px), linear-gradient(90deg, rgba(22,33,62,0.1) 0.5px, transparent 0.5px), linear-gradient(rgba(22,33,62,0.028) 0.5px, transparent 0.5px), linear-gradient(90deg, rgba(22,33,62,0.028) 0.5px, transparent 0.5px), var(--light); background-size: 50px 50px, 50px 50px, 10px 10px, 10px 10px, auto; color: var(--ink); line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column; }
[dir="rtl"] body { font-family: 'Tajawal', 'Inter', sans-serif; }
a { text-decoration: none; color: inherit; }
h1, h2, h3 { font-family: 'Fraunces', 'Tajawal', serif; }

nav { background: var(--white); border-bottom: 2px solid var(--ink); padding: 10px 5%; display: flex; justify-content: space-between; align-items: center; }
.logo { display: flex; align-items: center; gap: 12px; }
.logo-img-wrap { width: 40px; height: 40px; border-radius: 50%; background: var(--white); padding: 2px; border: 2px solid var(--ink); }
.logo-img-wrap img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
.logo-texte .titre { font-family: 'Fraunces', serif; font-size: 1.2rem; font-weight: 700; }
.nav-right { display: flex; align-items: center; gap: 10px; }
.btn-back { background: var(--ink); color: var(--white); padding: 8px 18px; border-radius: var(--radius-sm); font-weight: 600; font-size: 0.9rem; transition: var(--transition); display: flex; align-items: center; gap: 6px; border: 2px solid var(--ink); }
.btn-back:hover { background: var(--white); color: var(--ink); }
.btn-back.secondary { background: transparent; color: var(--ink); border-color: var(--ink); }
.btn-back.secondary:hover { background: var(--ink); color: var(--white); }

.main-content { flex: 1; padding: 40px 5%; max-width: 900px; margin: 0 auto; width: 100%; }
.page-title { text-align: center; margin-bottom: 30px; }
.page-title h1 { font-size: 2.2rem; margin-bottom: 10px; }
.page-title p { color: var(--gray); }

.lab-card { background: var(--white); border: 2px solid var(--ink); border-radius: var(--radius); padding: 30px; box-shadow: var(--shadow-lg); }

.input-group { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
.input-group input, .input-group select { padding: 14px 18px; border: 2px solid var(--ink); border-radius: var(--radius-sm); font-family: 'JetBrains Mono', monospace; font-size: 1.1rem; color: var(--ink); background: var(--light); transition: var(--transition); }
.input-group input { flex: 2; min-width: 250px; }
.input-group select { flex: 1; min-width: 150px; cursor: pointer; }
.input-group input:focus, .input-group select:focus { outline: none; border-color: var(--primary-light); box-shadow: 0 0 0 3px rgba(42,157,143,0.2); }
.btn-calc { background: var(--ink); color: var(--white); border: 2px solid var(--ink); padding: 14px 25px; border-radius: var(--radius-sm); font-weight: 700; font-size: 1rem; cursor: pointer; transition: var(--transition); display: flex; align-items: center; justify-content: center; gap: 8px; }
.btn-calc:hover { background: var(--accent); color: var(--ink); border-color: var(--accent); transform: translateY(-2px); }

.result-container { display: none; margin-top: 25px; animation: fadeIn 0.4s ease; }
.result-container.visible { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.result-header { background: var(--ink); color: var(--white); padding: 20px; border-radius: var(--radius) var(--radius) 0 0; text-align: center; }
.result-header .lbl { font-size: 0.85rem; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-family: 'JetBrains Mono', monospace; }
.result-header .val { font-family: 'Fraunces', serif; font-size: 2.5rem; font-weight: 700; }
.method-box { background: #fff; border: 2px solid var(--ink); border-top: none; border-radius: 0 0 var(--radius) var(--radius); padding: 25px; }
.method-box h3 { font-size: 1.1rem; margin-bottom: 15px; color: var(--ink); display: flex; align-items: center; gap: 8px; }
.method-box h3 i { color: var(--primary-light); }

.step-item { display: flex; gap: 15px; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px dashed var(--border); }
.step-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
.step-num { width: 28px; height: 28px; background: var(--light); border: 1.5px solid var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 0.85rem; color: var(--accent-dark); flex-shrink: 0; }
.step-text { flex: 1; font-size: 0.95rem; color: var(--ink); line-height: 1.6; }
.step-text code { background: var(--light); padding: 2px 6px; border-radius: 4px; font-family: 'JetBrains Mono', monospace; color: var(--accent-dark); font-size: 0.9rem; }
.step-text .highlight { color: var(--primary-light); font-weight: 700; }

.table-values { width: 100%; border-collapse: collapse; margin-top: 15px; font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; }
.table-values th, .table-values td { border: 1px solid var(--border); padding: 8px 12px; text-align: center; }
.table-values th { background: var(--light); font-weight: 700; color: var(--ink); }
.table-values td { color: var(--gray); }
.table-values td.approach { color: var(--primary-light); font-weight: 700; }

.error-box { background: #fdf2f2; border: 2px solid #c0483f; border-radius: var(--radius); padding: 20px; text-align: center; color: #c0483f; font-weight: 600; margin-top: 25px; display: none; }
.error-box.visible { display: block; }

.hint { font-size: 0.85rem; color: var(--gray); margin-top: 20px; text-align: center; }
.hint code { background: var(--light); padding: 2px 6px; border-radius: 4px; font-family: 'JetBrains Mono', monospace; color: var(--accent); }

@media (max-width: 768px) {
  .input-group { flex-direction: column; }
  .btn-calc { width: 100%; }
  .btn-back span { display: none; }
  .btn-back { padding: 8px 12px; }
  .page-title h1 { font-size: 1.8rem; }
  .result-header .val { font-size: 2rem; }
  .table-values { font-size: 0.75rem; }
  .table-values th, .table-values td { padding: 5px; }
}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="logo">
    <div class="logo-img-wrap"><img src="../assets/logo-darrssy.png" alt="DARRSSY"></div>
    <div class="logo-texte"><span class="titre">DARRSSY Maths</span></div>
  </a>
  <div class="nav-right">
    <a href="index.html" class="btn-back secondary"><i class="fas fa-th-large"></i> <span data-i18n="nav.menu">Menu Maths</span></a>
    <a href="../index.html" class="btn-back"><i class="fas fa-home"></i> <span data-i18n="nav.home">Site DARRSSY</span></a>
  </div>
</nav>

<div class="main-content">
  <div class="page-title">
    <h1 data-i18n="title">Calculateur de limites</h1>
    <p data-i18n="desc">Entrez une fonction, choisissez la valeur cible et obtenez le résultat avec la méthode.</p>
  </div>

  <div class="lab-card">
    <div class="input-group">
      <input type="text" id="limitFunction" placeholder="Ex: (x^2 - 1)/(x - 1)" value="(x^2 - 1)/(x - 1)" onkeypress="if(event.key === 'Enter') calculateLimit()">
      <select id="limitTarget">
        <option value="0">x → 0</option>
        <option value="1" selected>x → 1</option>
        <option value="2">x → 2</option>
        <option value="-1">x → -1</option>
        <option value="Infinity">x → +∞</option>
        <option value="-Infinity">x → -∞</option>
      </select>
      <button class="btn-calc" onclick="calculateLimit()"><i class="fas fa-calculator"></i> <span data-i18n="calc">Calculer</span></button>
    </div>

    <div class="result-container" id="resultContainer">
      <div class="result-header">
        <div class="lbl" data-i18n="result.lbl">Résultat de la limite</div>
        <div class="val" id="resultValue">—</div>
      </div>
      <div class="method-box">
        <h3><i class="fas fa-shoe-prints"></i> <span data-i18n="method.title">Méthode de calcul</span></h3>
        <div id="methodSteps"></div>
      </div>
    </div>

    <div class="error-box" id="errorBox"></div>

    <div class="hint" data-i18n="hint">
      Astuce : <code>(x^2-1)/(x-1)</code> · <code>sin(x)/x</code> · <code>(1+1/x)^x</code> · <code>exp(-x)</code>
    </div>
  </div>
</div>

<script>
let currentLang = localStorage.getItem('darrssy-lang') || 'fr';

const trad = {
  fr: {
    'nav.menu': 'Menu Maths', 'nav.home': 'Site DARRSSY',
    'title': 'Calculateur de limites',
    'desc': 'Entrez une fonction, choisissez la valeur cible et obtenez le résultat avec la méthode.',
    'calc': 'Calculer', 'result.lbl': 'Résultat de la limite', 'method.title': 'Méthode de calcul',
    'hint': 'Astuce : <code>(x^2-1)/(x-1)</code> · <code>sin(x)/x</code> · <code>(1+1/x)^x</code> · <code>exp(-x)</code>',
    'err.syntax': 'Erreur de syntaxe dans la fonction.', 'err.noLimit': "La limite n'existe pas (valeurs différentes à gauche et à droite).",
    'infinity': '+∞', 'minusInfinity': '-∞',
    'step.table': 'Tableau de valeurs',
    'step.table.desc': 'On évalue la fonction pour des valeurs de <code>x</code> de plus en plus proches de la valeur cible.',
    'step.left': 'Limite à gauche',
    'step.left.desc': 'Valeurs approchées par la gauche :',
    'step.right': 'Limite à droite',
    'step.right.desc': 'Valeurs approchées par la droite :',
    'step.table.result': 'On constate que les deux suites de valeurs tendent vers la même limite :',
    'step.infinity': 'Comportement à l\'infini',
    'step.infinity.desc': 'On étudie le comportement de la fonction lorsque <code>x</code> devient très grand (ou très petit).',
    'step.final': 'Conclusion',
    'step.final.desc': 'La limite de la fonction est <span class="highlight">{res}</span>.'
  },
  ar: {
    'nav.menu': 'قائمة الرياضيات', 'nav.home': 'موقع DARRSSY',
    'title': 'حاسبة النهايات',
    'desc': 'أدخل دالة، اختر القيمة المستهدفة واحصل على النتيجة مع الطريقة.',
    'calc': 'حساب', 'result.lbl': 'نتيجة النهاية', 'method.title': 'طريقة الحساب',
    'hint': 'نصيحة: <code>(x^2-1)/(x-1)</code> · <code>sin(x)/x</code> · <code>(1+1/x)^x</code> · <code>exp(-x)</code>',
    'err.syntax': 'خطأ في صياغة الدالة.', 'err.noLimit': 'النهاية غير موجودة (قيم مختلفة من اليسار واليمين).',
    'infinity': '+∞', 'minusInfinity': '-∞',
    'step.table': 'جدول القيم',
    'step.table.desc': 'نحسب قيم الدالة من أجل قيم <code>x</code> تقترب أكثر فأكثر من القيمة المستهدفة.',
    'step.left': 'النهاية من اليسار',
    'step.left.desc': 'قيم مقربة من اليسار:',
    'step.right': 'النهاية من اليمين',
    'step.right.desc': 'قيم مقربة من اليمين:',
    'step.table.result': 'نلاحظ أن كلا المتتاليتين من القيم تتجهان نحو نفس النهاية:',
    'step.infinity': 'السلوك عند اللانهاية',
    'step.infinity.desc': 'ندرس سلوك الدالة عندما تصبح <code>x</code> كبيرة جداً (أو صغيرة جداً).',
    'step.final': 'استنتاج',
    'step.final.desc': 'نهاية الدالة هي <span class="highlight">{res}</span>.'
  }
};

document.addEventListener('DOMContentLoaded', () => { appliquerLangue(currentLang); });

function appliquerLangue(lang) {
  currentLang = lang;
  document.getElementById('htmlRoot').setAttribute('lang', lang);
  document.getElementById('htmlRoot').setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (trad[lang] && trad[lang][key]) el.innerHTML = trad[lang][key];
  });
  localStorage.setItem('darrssy-lang', lang);
}

function calculateLimit() {
  const expr = document.getElementById('limitFunction').value;
  const targetStr = document.getElementById('limitTarget').value;
  const resultContainer = document.getElementById('resultContainer');
  const resultValue = document.getElementById('resultValue');
  const methodSteps = document.getElementById('methodSteps');
  const errorBox = document.getElementById('errorBox');

  resultContainer.classList.remove('visible');
  errorBox.classList.remove('visible');
  methodSteps.innerHTML = '';

  try {
    let target = targetStr === 'Infinity' ? Infinity : (targetStr === '-Infinity' ? -Infinity : parseFloat(targetStr));
    let limitVal;
    let steps = [];

    if (target === Infinity || target === -Infinity) {
      // CAS INFINI
      steps.push({ title: trad[currentLang]['step.infinity'], desc: trad[currentLang]['step.infinity.desc'] });
      const testVal = target === Infinity ? 1e8 : -1e8;
      limitVal = math.evaluate(expr, { x: testVal });
      if (!isFinite(limitVal)) {
        if (limitVal > 0) limitVal = trad[currentLang]['infinity'];
        else if (limitVal < 0) limitVal = trad[currentLang]['minusInfinity'];
      } else if (Math.abs(limitVal) < 1e-6) { limitVal = 0; }

    } else {
      // CAS POINT FINI : TABLEAU DE VALEURS
      steps.push({ title: trad[currentLang]['step.table'], desc: trad[currentLang]['step.table.desc'] });
      
      // Générer les valeurs de gauche et de droite
      const stepsVal = [0.1, 0.01, 0.001, 0.0001];
      let leftValues = [];
      let rightValues = [];
      
      for (let h of stepsVal) {
        try { leftValues.push({ x: (target - h).toFixed(4), y: math.evaluate(expr, { x: target - h }) }); } 
        catch(e) { leftValues.push({ x: (target - h).toFixed(4), y: NaN }); }
        try { rightValues.push({ x: (target + h).toFixed(4), y: math.evaluate(expr, { x: target + h }) }); } 
        catch(e) { rightValues.push({ x: (target + h).toFixed(4), y: NaN }); }
      }

      // Extraire la limite (moyenne des deux dernières valeurs)
      const lastLeft = leftValues[3].y;
      const lastRight = rightValues[3].y;

      if (isNaN(lastLeft) || isNaN(lastRight)) {
        throw new Error('syntax');
      }

      if (Math.abs(lastLeft - lastRight) > 1e-3 && isFinite(lastLeft) && isFinite(lastRight)) {
        throw new Error('noLimit');
      }

      limitVal = (lastLeft + lastRight) / 2;

      // Créer le tableau HTML
      let tableHTML = `<table class="table-values">
        <tr><th>x (gauche)</th><th>f(x)</th><th>x (droite)</th><th>f(x)</th></tr>`;
      
      for (let i = 0; i < stepsVal.length; i++) {
        const lY = isNaN(leftValues[i].y) ? '—' : Number(leftValues[i].y).toFixed(5);
        const rY = isNaN(rightValues[i].y) ? '—' : Number(rightValues[i].y).toFixed(5);
        tableHTML += `<tr>
          <td>${leftValues[i].x}</td><td>${lY}</td>
          <td>${rightValues[i].x}</td><td>${rY}</td>
        </tr>`;
      }
      tableHTML += `</table>`;
      
      steps.push({ 
        title: trad[currentLang]['step.table.result'], 
        desc: tableHTML 
      });
    }

    // Formater le résultat final
    let finalResult = limitVal;
    if (typeof finalResult === 'number') {
      if (!isFinite(finalResult) || isNaN(finalResult)) {
        finalResult = '—';
      } else {
        let rounded = Math.round(finalResult * 100000) / 100000;
        if (Math.abs(rounded - Math.round(rounded)) < 1e-4) rounded = Math.round(rounded);
        finalResult = rounded;
      }
    }

    steps.push({
      title: trad[currentLang]['step.final'],
      desc: trad[currentLang]['step.final.desc'].replace('{res}', finalResult)
    });

    resultValue.textContent = finalResult;
    methodSteps.innerHTML = steps.map((s, i) => `
      <div class="step-item">
        <div class="step-num">${i + 1}</div>
        <div class="step-text">
          <strong>${s.title}</strong><br>
          ${s.desc}
        </div>
      </div>
    `).join('');

    resultContainer.classList.add('visible');

  } catch (e) {
    errorBox.textContent = trad[currentLang][e.message === 'noLimit' ? 'err.noLimit' : 'err.syntax'];
    errorBox.classList.add('visible');
  }
}
</script>
</body>
</html>
