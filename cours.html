<!DOCTYPE html>
<html lang="fr" id="htmlRoot">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cours — A SALIKI PC</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --noir-profond: #050b14;
      --bleu-nuit: #0a1428;
      --bleu-carte: #0f1e38;
      --bleu-bordure: #1a2f52;
      --cyan-neon: #22d3ee;
      --cyan-clair: #67e8f9;
      --vert-neon: #4ade80;
      --vert-fluo: #22c55e;
      --violet-tech: #8b5cf6;
      --or: #fbbf24;
      --rose: #f472b6;
      --rouge: #ef4444;
      --texte-principal: #ffffff;
      --texte-secondaire: #94a3b8;
      --texte-tertiaire: #cbd5e1;
      --fond-principal: #050b14;
      --fond-secondaire: #0a1428;
      --fond-carte: #0f1e38;
      --bordure: #1a2f52;
      --ombre-neon: 0 0 40px -10px rgba(34, 211, 238, 0.4);
      --rayon: 1rem;
      --rayon-petit: 0.6rem;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      --grille-couleur: rgba(34, 211, 238, 0.03);
    }
    [data-theme="light"] {
      --noir-profond: #f8fafc;
      --bleu-nuit: #ffffff;
      --bleu-carte: #ffffff;
      --bleu-bordure: #e2e8f0;
      --cyan-neon: #0891b2;
      --cyan-clair: #06b6d4;
      --vert-neon: #16a34a;
      --vert-fluo: #22c55e;
      --violet-tech: #7c3aed;
      --or: #d97706;
      --rose: #db2777;
      --rouge: #dc2626;
      --texte-principal: #0a1428;
      --texte-secondaire: #475569;
      --texte-tertiaire: #334155;
      --fond-principal: #f8fafc;
      --fond-secondaire: #ffffff;
      --fond-carte: #ffffff;
      --bordure: #e2e8f0;
      --ombre-neon: 0 10px 30px -10px rgba(8, 145, 178, 0.25);
      --grille-couleur: rgba(8, 145, 178, 0.05);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--fond-principal);
      color: var(--texte-tertiaire);
      line-height: 1.6;
      overflow-x: hidden;
      transition: background-color 0.4s ease, color 0.4s ease;
    }
    [dir="rtl"] body { font-family: 'Cairo', 'Inter', sans-serif; }
    h1, h2, h3, h4, .logo { font-family: 'Space Grotesk', sans-serif; letter-spacing: -0.02em; }
    [dir="rtl"] h1, [dir="rtl"] h2, [dir="rtl"] h3, [dir="rtl"] h4 { font-family: 'Cairo', sans-serif; letter-spacing: 0; }
    a { text-decoration: none; color: inherit; }
    .container { max-width: 1400px; margin: 0 auto; padding: 0 1.5rem; }
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image:
        linear-gradient(var(--grille-couleur) 1px, transparent 1px),
        linear-gradient(90deg, var(--grille-couleur) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
      z-index: 0;
    }
    section, header { position: relative; z-index: 1; }

    .header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(5, 11, 20, 0.9);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--bordure);
    }
    [data-theme="light"] .header { background: rgba(255, 255, 255, 0.9); }
    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.9rem 0;
      gap: 1rem;
    }
    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--texte-principal);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      white-space: nowrap;
    }
    .logo-icon {
      width: 38px; height: 38px;
      border-radius: 0.5rem;
      background: linear-gradient(135deg, var(--cyan-neon), var(--vert-neon));
      display: flex;
      align-items: center;
      justify-content: center;
      color: #050b14;
      font-size: 1.1rem;
      box-shadow: 0 0 20px -5px rgba(34, 211, 238, 0.7);
    }
    .logo span {
      background: linear-gradient(135deg, var(--cyan-neon), var(--vert-neon));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .nav-desktop { display: flex; align-items: center; gap: 0.1rem; }
    .nav-desktop a {
      padding: 0.5rem 0.85rem;
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--texte-secondaire);
      border-radius: 0.4rem;
      transition: var(--transition);
      white-space: nowrap;
    }
    .nav-desktop a:hover { color: var(--cyan-neon); background: rgba(34, 211, 238, 0.08); }
    .nav-desktop a.actif { color: var(--cyan-neon); background: rgba(34, 211, 238, 0.12); }
    .nav-desktop a.admin-link { color: var(--rose); }
    .header-actions { display: flex; align-items: center; gap: 0.5rem; }
    .lang-switcher {
      display: flex;
      background: rgba(34, 211, 238, 0.08);
      border: 1px solid var(--bordure);
      border-radius: 0.4rem;
      overflow: hidden;
    }
    .lang-btn {
      background: transparent;
      border: none;
      color: var(--texte-secondaire);
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.55rem 0.85rem;
      cursor: pointer;
      transition: var(--transition);
    }
    .lang-btn.actif {
      background: linear-gradient(135deg, var(--cyan-neon), var(--vert-neon));
      color: #050b14;
    }

    .hero-cours {
      padding: 3.5rem 0 2rem;
      text-align: center;
      position: relative;
    }
    .hero-cours::before {
      content: '';
      position: absolute;
      top: -50%; left: 50%;
      transform: translateX(-50%);
      width: 700px; height: 500px;
      background: radial-gradient(ellipse, rgba(34, 211, 238, 0.12), transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }
    .hero-cours h1 {
      font-size: 2.6rem;
      font-weight: 700;
      color: var(--texte-principal);
      margin-bottom: 0.6rem;
      position: relative;
    }
    .hero-cours h1 .accent {
      background: linear-gradient(135deg, var(--cyan-neon), var(--vert-neon));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .hero-cours p {
      color: var(--texte-secondaire);
      font-size: 1.05rem;
      max-width: 650px;
      margin: 0 auto;
      position: relative;
    }

    .search-wrap {
      max-width: 700px;
      margin: 2rem auto 1.5rem;
      position: relative;
    }
    .search-input {
      width: 100%;
      padding: 1rem 1.2rem 1rem 3.2rem;
      background: var(--fond-carte);
      border: 1.5px solid var(--bordure);
      border-radius: 0.8rem;
      color: var(--texte-principal);
      font-family: inherit;
      font-size: 1rem;
      transition: var(--transition);
    }
    [dir="rtl"] .search-input { padding: 1rem 3.2rem 1rem 1.2rem; }
    .search-input:focus {
      outline: none;
      border-color: var(--cyan-neon);
      box-shadow: 0 0 20px -5px rgba(34, 211, 238, 0.5);
    }
    .search-input::placeholder { color: var(--texte-secondaire); }
    .search-icon {
      position: absolute;
      top: 50%; left: 1.2rem;
      transform: translateY(-50%);
      color: var(--cyan-neon);
      font-size: 1.1rem;
      pointer-events: none;
    }
    [dir="rtl"] .search-icon { left: auto; right: 1.2rem; }

    .filtres-panel {
      background: var(--fond-carte);
      border: 1px solid var(--bordure);
      border-radius: var(--rayon);
      padding: 1.3rem 1.5rem;
      margin-bottom: 2rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      align-items: end;
    }
    .filtre-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--cyan-neon);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.5rem;
    }
    .filtre-select {
      width: 100%;
      padding: 0.65rem 0.9rem;
      background: var(--fond-principal);
      border: 1px solid var(--bordure);
      border-radius: 0.5rem;
      color: var(--texte-principal);
      font-family: inherit;
      font-size: 0.9rem;
      cursor: pointer;
      transition: var(--transition);
    }
    .filtre-select:focus { outline: none; border-color: var(--cyan-neon); }
    .btn-reset {
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: var(--rouge);
      padding: 0.65rem 1.2rem;
      border-radius: 0.5rem;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      justify-content: center;
    }
    .btn-reset:hover { background: var(--rouge); color: white; }

    .resultats-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      padding: 0.8rem 1rem;
      background: rgba(34, 211, 238, 0.05);
      border: 1px solid rgba(34, 211, 238, 0.15);
      border-radius: 0.6rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .resultats-bar .count { font-size: 0.9rem; color: var(--texte-secondaire); }
    .resultats-bar .count strong { color: var(--cyan-neon); font-weight: 700; font-size: 1.1rem; }

    .cours-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
      margin-bottom: 3rem;
    }
    .cours-card {
      background: linear-gradient(160deg, var(--fond-carte), var(--fond-secondaire));
      border: 1px solid var(--bordure);
      border-radius: var(--rayon);
      overflow: hidden;
      transition: var(--transition);
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .cours-card:hover {
      transform: translateY(-6px);
      border-color: rgba(34, 211, 238, 0.4);
      box-shadow: var(--ombre-neon);
    }
    .cours-card .image {
      height: 140px;
      background: linear-gradient(135deg, rgba(34, 211, 238, 0.15), rgba(74, 222, 128, 0.1));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      color: var(--cyan-neon);
      position: relative;
      border-bottom: 1px solid var(--bordure);
    }
    .cours-card .image.chimie {
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.15), rgba(74, 222, 128, 0.1));
      color: var(--vert-neon);
    }
    .cours-card .image.elec {
      background: linear-gradient(135deg, rgba(251, 191, 36, 0.15), rgba(34, 211, 238, 0.1));
      color: var(--or);
    }
    .cours-card .image.nucleaire {
      background: linear-gradient(135deg, rgba(244, 114, 182, 0.15), rgba(139, 92, 246, 0.1));
      color: var(--rose);
    }
    .cours-card .image.meca {
      background: linear-gradient(135deg, rgba(34, 211, 238, 0.15), rgba(34, 211, 238, 0.05));
      color: var(--cyan-clair);
    }
    .cours-card .badge-niveau {
      position: absolute;
      top: 12px; left: 12px;
      background: rgba(5, 11, 20, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(34, 211, 238, 0.4);
      color: var(--cyan-neon);
      font-size: 0.68rem;
      font-weight: 600;
      padding: 0.3rem 0.7rem;
      border-radius: 2rem;
      text-transform: uppercase;
    }
    [data-theme="light"] .cours-card .badge-niveau { background: rgba(255, 255, 255, 0.9); }
    .cours-card .contenu { padding: 1.2rem; flex: 1; display: flex; flex-direction: column; }
    .cours-card .matiere {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--vert-neon);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.4rem;
    }
    .cours-card h3 {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--texte-principal);
      margin-bottom: 0.7rem;
      line-height: 1.3;
    }
    .cours-card .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 0.9rem;
      font-size: 0.76rem;
      color: var(--texte-secondaire);
      margin-bottom: 0.9rem;
    }
    .cours-card .meta span { display: flex; align-items: center; gap: 0.3rem; }
    .cours-card .meta i { color: var(--cyan-neon); font-size: 0.72rem; }
    .cours-card .statut {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.25rem 0.75rem;
      border-radius: 2rem;
      margin-bottom: 1rem;
      align-self: flex-start;
      text-transform: uppercase;
    }
    .statut.gratuit { background: rgba(74, 222, 128, 0.12); color: var(--vert-neon); border: 1px solid rgba(74, 222, 128, 0.3); }
    .statut.premium { background: rgba(251, 191, 36, 0.12); color: var(--or); border: 1px solid rgba(251, 191, 36, 0.3); }
    .cours-card .btn-voir {
      margin-top: auto;
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.7rem 1.1rem;
      background: rgba(34, 211, 238, 0.08);
      border: 1px solid rgba(34, 211, 238, 0.3);
      color: var(--cyan-neon);
      border-radius: 0.5rem;
      font-weight: 600;
      font-size: 0.85rem;
      transition: var(--transition);
      cursor: pointer;
      font-family: inherit;
    }
    .cours-card .btn-voir:hover { background: var(--cyan-neon); color: #050b14; }

    .aucun-resultat {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--texte-secondaire);
    }
    .aucun-resultat i { font-size: 4rem; color: var(--bordure); margin-bottom: 1rem; }
    .aucun-resultat h3 { color: var(--texte-principal); font-size: 1.3rem; margin-bottom: 0.5rem; }

    .voir-plus-wrap { text-align: center; margin-bottom: 3rem; }
    .btn-voir-plus {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.85rem 2rem;
      background: rgba(34, 211, 238, 0.08);
      border: 1.5px solid var(--cyan-neon);
      color: var(--cyan-neon);
      border-radius: 0.5rem;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }
    .btn-voir-plus:hover { background: var(--cyan-neon); color: #050b14; }

    .panneau-detail {
      position: fixed;
      top: 0; right: 0;
      width: 100%;
      max-width: 700px;
      height: 100vh;
      background: var(--fond-secondaire);
      border-left: 1px solid var(--bordure);
      z-index: 2000;
      transform: translateX(100%);
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      overflow-y: auto;
      box-shadow: -20px 0 60px rgba(0, 0, 0, 0.5);
    }
    [dir="rtl"] .panneau-detail {
      right: auto; left: 0;
      border-left: none;
      border-right: 1px solid var(--bordure);
      transform: translateX(-100%);
    }
    .panneau-detail.ouvert { transform: translateX(0); }
    .panneau-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 11, 20, 0.7);
      backdrop-filter: blur(4px);
      z-index: 1999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .panneau-overlay.ouvert { opacity: 1; pointer-events: all; }
    .panneau-header {
      position: sticky;
      top: 0;
      background: var(--fond-secondaire);
      border-bottom: 1px solid var(--bordure);
      padding: 1.2rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }
    .panneau-header h2 {
      font-size: 1.2rem;
      color: var(--texte-principal);
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .panneau-header h2 i { color: var(--cyan-neon); }
    .btn-fermer {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: var(--rouge);
      width: 38px; height: 38px;
      border-radius: 0.5rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      transition: var(--transition);
    }
    .btn-fermer:hover { background: var(--rouge); color: white; }
    .panneau-corps { padding: 1.5rem; }
    .panneau-hero {
      background: linear-gradient(135deg, rgba(34, 211, 238, 0.15), rgba(74, 222, 128, 0.1));
      border-radius: var(--rayon);
      padding: 2rem;
      margin-bottom: 1.5rem;
      text-align: center;
      border: 1px solid rgba(34, 211, 238, 0.2);
    }
    .panneau-hero .icon-grand {
      font-size: 3.5rem;
      color: var(--cyan-neon);
      margin-bottom: 0.8rem;
    }
    .panneau-hero h1 {
      font-size: 1.6rem;
      color: var(--texte-principal);
      margin-bottom: 0.5rem;
    }
    .panneau-hero .badges {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 1rem;
    }
    .panneau-hero .badges span {
      background: rgba(5, 11, 20, 0.5);
      border: 1px solid rgba(34, 211, 238, 0.3);
      color: var(--cyan-neon);
      padding: 0.3rem 0.8rem;
      border-radius: 2rem;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .panneau-section { margin-bottom: 1.5rem; }
    .panneau-section h3 {
      font-size: 1rem;
      font-weight: 700;
      color: var(--texte-principal);
      margin-bottom: 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .panneau-section h3 i { color: var(--cyan-neon); }
    .panneau-section p { color: var(--texte-secondaire); font-size: 0.92rem; line-height: 1.7; }

    .ressources-liste { display: flex; flex-direction: column; gap: 0.6rem; }
    .ressource-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      background: var(--fond-principal);
      border: 1px solid var(--bordure);
      border-radius: 0.5rem;
      padding: 0.8rem 1rem;
      transition: var(--transition);
      cursor: pointer;
    }
    .ressource-item:hover { border-color: var(--cyan-neon); transform: translateX(5px); }
    [dir="rtl"] .ressource-item:hover { transform: translateX(-5px); }
    .ressource-item .icon-type {
      width: 38px; height: 38px;
      border-radius: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
    }
    .ressource-item .icon-type.cours { background: rgba(34, 211, 238, 0.1); color: var(--cyan-neon); }
    .ressource-item .icon-type.exercice { background: rgba(251, 191, 36, 0.1); color: var(--or); }
    .ressource-item .icon-type.corrige { background: rgba(74, 222, 128, 0.1); color: var(--vert-neon); }
    .ressource-item .info { flex: 1; }
    .ressource-item .info h4 { font-size: 0.9rem; font-weight: 600; color: var(--texte-principal); margin-bottom: 0.15rem; }
    .ressource-item .info span { font-size: 0.75rem; color: var(--texte-secondaire); }
    .ressource-item .btn-dl {
      background: rgba(34, 211, 238, 0.08);
      border: 1px solid rgba(34, 211, 238, 0.3);
      color: var(--cyan-neon);
      padding: 0.4rem 0.8rem;
      border-radius: 0.4rem;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      font-family: inherit;
    }
    .ressource-item .btn-dl:hover { background: var(--cyan-neon); color: #050b14; }

    .theme-toggle {
      position: fixed;
      bottom: 2rem; right: 2rem;
      width: 58px; height: 58px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--cyan-neon), var(--vert-neon));
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      color: #050b14;
      box-shadow: 0 8px 30px -5px rgba(34, 211, 238, 0.7);
      transition: var(--transition);
      z-index: 9999;
    }
    [dir="rtl"] .theme-toggle { right: auto; left: 2rem; }
    .theme-toggle:hover { transform: translateY(-4px) rotate(15deg) scale(1.05); }
    .theme-toggle .icon-sun { display: none; }
    [data-theme="light"] .theme-toggle .icon-sun { display: block; }
    [data-theme="light"] .theme-toggle .icon-moon { display: none; }

    @media (max-width: 768px) {
      .nav-desktop { display: none; }
      .hero-cours h1 { font-size: 1.9rem; }
      .cours-grid { grid-template-columns: 1fr; }

    ];

    const trad = {
      fr: {

        'cours.aucunTitre': 'Aucun cours trouvé',

        'cours.voirPlus': 'Voir plus de cours',

        'niveau.tronc': 'Tronc Commun', 'niveau.1bac': '1ère Bac',
        'niveau.2bacpc': '2ème Bac PC', 'niveau.2bacsvt': '2ème Bac SVT',
        'matiere.physique': 'Physique', 'matiere.chimie': 'Chimie',

        'panneau.description': 'Description',
        'panneau.ressources': 'Ressources disponibles',

      },
      ar: {
        'nav.home': 'الرئيسية', 'nav.cours': 'الدروس', 'nav.exercices': 'التمارين',
        'nav.examens': 'الامتحانات', 'nav.simulations': 'المحاكاة', 'nav.qcm': 'اختبار',

        'filtre.reset': 'إعادة',

        'matiere.physique': 'الفيزياء', 'matiere.chimie': 'الكيمياء',

        'panneau.telecharger': 'تحميل'
      }
    };

    let currentLang = localStorage.getItem('asaliki-lang') || 'fr';
    let filtres = { niveau: 'all', matiere: 'all', recherche: '' };
    let coursAffiches = 8;

    document.addEventListener('DOMContentLoaded', () => {
      appliquerTheme();
      afficherCours();
      bindEvents();
      appliquerLangue(currentLang);
    });

    function appliquerTheme() {
      const savedTheme = localStorage.getItem('asaliki-theme') || 'dark';
      document.getElementById('htmlRoot').setAttribute('data-theme', savedTheme);
    }

    function appliquerLangue(lang) {
      currentLang = lang;
      document.getElementById('htmlRoot').setAttribute('lang', lang);
      document.getElementById('htmlRoot').setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (trad[lang] && trad[lang][key]) el.textContent = trad[lang][key];
      });
      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        const key = el.getAttribute('data-i18n-placeholder');
        if (trad[lang] && trad[lang][key]) el.placeholder = trad[lang][key];
      });
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('actif', btn.getAttribute('data-lang') === lang);
      });
      localStorage.setItem('asaliki-lang', lang);
      afficherCours();
    }

    function bindEvents() {
      document.getElementById('searchInput').addEventListener('input', (e) => {
        filtres.recherche = e.target.value.toLowerCase().trim();
        coursAffiches = 8;
        afficherCours();
      });
      document.getElementById('filtreNiveau').addEventListener('change', (e) => {
        filtres.niveau = e.target.value;
        coursAffiches = 8;
        afficherCours();
      });
      document.getElementById('filtreMatiere').addEventListener('change', (e) => {
        filtres.matiere = e.target.value;
        coursAffiches = 8;
        afficherCours();
      });
      document.getElementById('btnReset').addEventListener('click', () => {
        filtres = { niveau: 'all', matiere: 'all', recherche: '' };
        document.getElementById('searchInput').value = '';
        document.getElementById('filtreNiveau').value = 'all';
        document.getElementById('filtreMatiere').value = 'all';
        coursAffiches = 8;
        afficherCours();
      });
      document.getElementById('btnVoirPlus').addEventListener('click', () => {
        coursAffiches += 8;
        afficherCours();
      });
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', () => appliquerLangue(btn.getAttribute('data-lang')));
      });
      document.getElementById('themeToggle').addEventListener('click', () => {
        const current = document.getElementById('htmlRoot').getAttribute('data-theme');
        const next = current === 'dark' ? 'light' : 'dark';
        document.getElementById('htmlRoot').setAttribute('data-theme', next);
        localStorage.setItem('asaliki-theme', next);
      });
      document.getElementById('btnFermerPanneau').addEventListener('click', fermerPanneau);
      document.getElementById('panneauOverlay').addEventListener('click', fermerPanneau);
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') fermerPanneau();
      });
    }

    function filtrerCours() {
      return cours.filter(c => {
        if (filtres.niveau !== 'all' && c.niveau !== filtres.niveau) return false;
        if (filtres.matiere !== 'all' && c.matiere !== filtres.matiere) return false;
        if (filtres.recherche) {
          const titre = currentLang === 'fr' ? c.titre_fr : c.titre_ar;
          const chap = currentLang === 'fr' ? c.chapitre_fr : c.chapitre_ar;
          const texte = (titre + ' ' + chap).toLowerCase();
          if (!texte.includes(filtres.recherche)) return false;
        }
        return true;
      });
    }

    function afficherCours() {
      const grid = document.getElementById('coursGrid');
      const aucun = document.getElementById('aucunResultat');
      const voirPlusWrap = document.getElementById('voirPlusWrap');
      const filtered = filtrerCours();
      const displayed = filtered.slice(0, coursAffiches);

      document.getElementById('countResultats').textContent = filtered.length;

      if (filtered.length === 0) {
        grid.innerHTML = '';
        grid.style.display = 'none';
        aucun.style.display = 'block';
        voirPlusWrap.style.display = 'none';
        return;
      }

      grid.style.display = 'grid';
      aucun.style.display = 'none';
      grid.innerHTML = '';
      displayed.forEach(c => grid.appendChild(creerCarte(c)));
      voirPlusWrap.style.display = filtered.length > coursAffiches ? 'block' : 'none';
    }

    function creerCarte(c) {
      const card = document.createElement('div');
      card.className = 'cours-card';
      const niveauLabel = trad[currentLang]['niveau.' + c.niveau];
      const titre = currentLang === 'fr' ? c.titre_fr : c.titre_ar;
      const desc = currentLang === 'fr' ? c.description_fr : c.description_ar;

      card.innerHTML = `
        <div class="image ${c.classeIcone}">
          <i class="fas ${c.icone}"></i>
          <span class="badge-niveau">${niveauLabel}</span>
        </div>
        <div class="contenu">
          <div class="matiere">${trad[currentLang]['matiere.' + c.matiere]}</div>
          <h3>${titre}</h3>
          <div class="meta">
            <span><i class="fas fa-user"></i> A. Saliki</span>
            <span><i class="fas fa-file-alt"></i> ${c.ressources} ${currentLang === 'fr' ? 'ressources' : 'موارد'}</span>
          </div>
          <span class="statut ${c.statut}">${trad[currentLang]['statut.' + c.statut]}</span>
          <button class="btn-voir">
            <span>${trad[currentLang]['card.voirCours']}</span>
            <i class="fas fa-arrow-right"></i>
          </button>
        </div>
      `;

      card.querySelector('.btn-voir').addEventListener('click', () => ouvrirPanneau(c));
      card.addEventListener('click', (e) => {
        if (!e.target.closest('.btn-voir')) ouvrirPanneau(c);
      });

      return card;
    }

    function ouvrirPanneau(c) {

      const corps = document.getElementById('panneauCorps');
      const niveauLabel = trad[currentLang]['niveau.' + c.niveau];
      const titre = currentLang === 'fr' ? c.titre_fr : c.titre_ar;
      const desc = currentLang === 'fr' ? c.description_fr : c.description_ar;
      const chap = currentLang === 'fr' ? c.chapitre_fr : c.chapitre_ar;

      const ressources = [
        { type: 'cours', titre: currentLang === 'fr' ? 'Cours complet PDF' : 'الدرس الكامل PDF', taille: '2.4 Mo' },
        { type: 'exercice', titre: currentLang === 'fr' ? 'Exercices d\'application' : 'تمارين تطبيقية', taille: '1.1 Mo' },
        { type: 'corrige', titre: currentLang === 'fr' ? 'Corrigés détaillés' : 'حلول مفصلة', taille: '980 Ko' }

      const icones = { cours: 'fa-file-pdf', exercice: 'fa-pencil-alt', corrige: 'fa-check-circle' };

      corps.innerHTML = `

          <div class="icon-grand"><i class="fas ${c.icone}"></i></div>
          <h1>${titre}</h1>
          <div class="badges">
            <span>${niveauLabel}</span>
            <span>${trad[currentLang]['matiere.' + c.matiere]}</span>
            <span>${chap}</span>
            <span>${c.ressources} ${currentLang === 'fr' ? 'ressources' : 'موارد'}</span>
          </div>
        </div>
        <div class="panneau-section">
          <h3><i class="fas fa-info-circle"></i> ${trad[currentLang]['panneau.description']}</h3>
          <p>${desc}</p>
        </div>
        <div class="panneau-section">
          <h3><i class="fas fa-folder-open"></i> ${trad[currentLang]['panneau.ressources']}</h3>
          <div class="ressources-liste">
            ${ressources.map(r => `
              <div class="ressource-item">
                <div class="icon-type ${r.type}"><i class="fas ${icones[r.type]}"></i></div>
                <div class="info">
                  <h4>${r.titre}</h4>
                  <span>${r.taille}</span>
                </div>
                <button class="btn-dl">${trad[currentLang]['panneau.telecharger']}</button>
              </div>
            `).join('')}
          </div>
        </div>
      `;

      panneau.classList.add('ouvert');
      overlay.classList.add('ouvert');
      document.body.style.overflow = 'hidden';
    }

    function fermerPanneau() {
      document.getElementById('panneauDetail').classList.remove('ouvert');
      document.getElementById('panneauOverlay').classList.remove('ouvert');
      document.body.style.overflow = '';
    }
  </script>
</body>
</html>
