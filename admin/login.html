<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Connexion · A SALIKI PC</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #050b14;
      color: #cbd5e1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      overflow: hidden;
      position: relative;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(34, 211, 238, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(34, 211, 238, 0.04) 1px, transparent 1px);
      background-size: 50px 50px;
    }
    body::after {
      content: '';
      position: fixed;
      top: -20%; right: -10%;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(34, 211, 238, 0.15), transparent 70%);
      border-radius: 50%;
    }
    .login-box {
      position: relative; z-index: 1;
      background: linear-gradient(160deg, #0f1e38, #0a1428);
      border: 1px solid #1a2f52;
      border-radius: 1.5rem;
      padding: 3rem 2.5rem;
      width: 100%; max-width: 450px;
      box-shadow: 0 30px 80px -10px rgba(34, 211, 238, 0.3);
      animation: slideIn 0.6s ease;
    }
    @keyframes slideIn { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    .login-logo {
      display: flex; align-items: center; justify-content: center;
      gap: 0.7rem; margin-bottom: 0.5rem;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.8rem; font-weight: 700; color: white;
    }
    .login-logo .icon {
      width: 50px; height: 50px; border-radius: 0.8rem;
      background: linear-gradient(135deg, #22d3ee, #4ade80);
      display: flex; align-items: center; justify-content: center;
      color: #050b14; font-size: 1.5rem;
      box-shadow: 0 0 30px -5px rgba(34, 211, 238, 0.7);
    }
    .login-logo span {
      background: linear-gradient(135deg, #22d3ee, #4ade80);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .login-sub { text-align: center; color: #94a3b8; font-size: 0.9rem; margin-bottom: 2.5rem; }
    .login-sub .admin-badge {
      display: inline-block; background: rgba(34, 211, 238, 0.1);
      border: 1px solid rgba(34, 211, 238, 0.3);
      color: #22d3ee; padding: 0.2rem 0.7rem;
      border-radius: 2rem; font-size: 0.72rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.1em;
      margin-bottom: 1rem;
    }
    .form-group { margin-bottom: 1.3rem; }
    .form-group label {
      display: block; font-size: 0.78rem; font-weight: 600;
      color: #22d3ee; text-transform: uppercase;
      letter-spacing: 0.08em; margin-bottom: 0.5rem;
    }
    .form-group input {
      width: 100%; padding: 0.9rem 1.2rem;
      background: #050b14; border: 1.5px solid #1a2f52;
      border-radius: 0.6rem; color: white;
      font-family: inherit; font-size: 0.95rem;
      transition: all 0.3s;
    }
    .form-group input:focus {
      outline: none; border-color: #22d3ee;
      box-shadow: 0 0 20px -5px rgba(34, 211, 238, 0.5);
    }
    .btn-login {
      width: 100%; padding: 1rem;
      background: linear-gradient(135deg, #22d3ee, #4ade80);
      color: #050b14; border: none; border-radius: 0.6rem;
      font-family: inherit; font-size: 1rem; font-weight: 700;
      cursor: pointer; transition: all 0.3s;
      display: flex; align-items: center; justify-content: center;
      gap: 0.6rem; margin-top: 1rem;
    }
    .btn-login:hover:not(:disabled) {
      box-shadow: 0 0 40px -5px rgba(34, 211, 238, 0.9);
      transform: translateY(-2px);
    }
    .btn-login:disabled { opacity: 0.5; cursor: not-allowed; }
    .message {
      padding: 1rem; border-radius: 0.6rem;
      font-size: 0.88rem; margin-top: 1rem;
      display: none;
    }
    .message.erreur {
      display: block; background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #ef4444;
    }
    .message.succes {
      display: block; background: rgba(74, 222, 128, 0.1);
      border: 1px solid rgba(74, 222, 128, 0.3);
      color: #4ade80;
    }
    .retour-lien { text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: #94a3b8; }
    .retour-lien a { color: #22d3ee; text-decoration: none; font-weight: 600; }
    .retour-lien a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="login-box">
    <div class="login-logo">
      <div class="icon"><i class="fas fa-atom"></i></div>
      A SALIKI <span>PC</span>
    </div>
    <div class="login-sub">
      <div class="admin-badge"><i class="fas fa-lock"></i> Administration</div>
      <div>Connectez-vous pour accéder au tableau de bord</div>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label><i class="fas fa-envelope"></i> Adresse email</label>
        <input type="email" id="email" placeholder="vous@example.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label><i class="fas fa-key"></i> Mot de passe</label>
        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-login" id="btnLogin">
        <i class="fas fa-sign-in-alt"></i> Se connecter
      </button>
      <div class="message" id="message"></div>
    </form>

    <div class="retour-lien">
      <a href="../index.html"><i class="fas fa-arrow-left"></i> Retour au site</a>
    </div>
  </div>

  <script src="supabase-config.js"></script>
  <script>
    const form = document.getElementById('loginForm');
    const btn = document.getElementById('btnLogin');
    const msg = document.getElementById('message');

    (async () => {
      const session = await verifierAuth();
      if (session) window.location.href = 'dashboard.html';
    })();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Connexion...';
      msg.className = 'message';

      try {
        const sb = await initSupabase();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        const { data, error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;

        msg.className = 'message succes';
        msg.innerHTML = '<i class="fas fa-check-circle"></i> Connexion réussie ! Redirection...';

        setTimeout(() => { window.location.href = 'dashboard.html'; }, 800);
      } catch (error) {
        msg.className = 'message erreur';
        let texte = 'Erreur de connexion.';
        if (error.message.includes('Invalid login credentials')) {
          texte = 'Email ou mot de passe incorrect.';
        } else if (error.message.includes('Email not confirmed')) {
          texte = 'Email non confirmé.';
        } else {
          texte = error.message;
        }
        msg.innerHTML = '<i class="fas fa-exclamation-circle"></i> ' + texte;
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Se connecter';
      }
    });
  </script>
</body>
</html>
